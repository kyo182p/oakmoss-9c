<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雲林排班工具</title>
<style>
:root{
  --ground:#E9EDEE; --surface:#FCFDFD; --sunk:#DFE5E7;
  --ink:#101B20; --ink-2:#41565F; --ink-3:#6D8189;
  --rule:#C8D3D6; --rule-2:#DDE4E6;
  --navy:#123B54; --navy-soft:#DEE9EE;
  --buoy:#B24E19; --buoy-soft:#F7E7DC;
  --ok:#2C6549; --ok-soft:#DFEDE6;
  --warn:#8A5A05; --warn-soft:#F6EBD7;
  --stop:#9C3524; --stop-soft:#F7E3DE;
  --night:#3B4E8A; --night-soft:#E2E6F4;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#08110F; --surface:#0F1A1E; --sunk:#141F24;
  --ink:#DCE6E9; --ink-2:#95A9B1; --ink-3:#74888F;
  --rule:#22333A; --rule-2:#1A272D;
  --navy:#68AECB; --navy-soft:#102B37;
  --buoy:#E58A52; --buoy-soft:#2B1911;
  --ok:#5FBE96; --ok-soft:#0F2820;
  --warn:#DFA754; --warn-soft:#2A2011;
  --stop:#EC8571; --stop-soft:#2E1611;
  --night:#93A6E0; --night-soft:#161B2E;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-size:14.5px;line-height:1.7;
  font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button{font:inherit;cursor:pointer}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px;color:var(--ink-2)}
.hide{display:none!important}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);border-radius:3px;padding:5px 8px}
input:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--navy);outline-offset:1px}

/* ---------- 開場 ---------- */
.start{max-width:660px;margin:0 auto;padding:56px 22px}
.start h1{font-size:30px;margin:0 0 10px;letter-spacing:-.01em}
.start p{color:var(--ink-2);margin:0 0 22px;max-width:56ch}
.drop{border:2px dashed var(--rule);border-radius:6px;background:var(--surface);
  padding:38px 26px;text-align:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--buoy);background:var(--buoy-soft)}
.drop .big{font-size:17px;font-weight:700;margin-bottom:6px}
.drop .sm{font-size:13px;color:var(--ink-3);margin-bottom:16px}
.filerow{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rule);flex:none}
.dot.on{background:var(--ok)}
.progress{margin-top:18px;font-size:13.5px;color:var(--ink-2);min-height:24px}
.warnbox{background:var(--warn-soft);border-left:3px solid var(--warn);padding:11px 15px;
  border-radius:3px;margin-top:18px;font-size:13.5px;color:var(--ink-2)}

/* ---------- 主框架 ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--rule);padding:9px 18px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:15.5px;white-space:nowrap}
.files{font-size:12px;color:var(--ink-3);line-height:1.5}
.files b{color:var(--ink-2);font-weight:500}
.spacer{flex:1}
.datepick{display:flex;gap:6px;align-items:center}
.nav{display:flex;gap:2px;padding:0 18px;background:var(--surface);
  border-bottom:1px solid var(--rule);position:sticky;top:47px;z-index:39;flex-wrap:wrap}
.nav button{background:none;border:none;border-bottom:2px solid transparent;
  padding:9px 15px;color:var(--ink-2);font-size:14px}
.nav button.on{color:var(--ink);border-bottom-color:var(--buoy);font-weight:700}
.nav .badge{display:inline-block;margin-left:6px;font-size:11px;padding:0 6px;
  border-radius:9px;background:var(--stop-soft);color:var(--stop);font-weight:700}
.wrap{padding:18px;max-width:1400px;margin:0 auto}

/* ---------- 搜尋式下拉 ---------- */
.cb{position:relative;display:inline-block}
.cb>input{width:100%;padding-right:22px}
.cb>.arrow{position:absolute;right:7px;top:50%;transform:translateY(-50%);
  color:var(--ink-3);font-size:10px;pointer-events:none}
.cb .list{position:absolute;z-index:60;top:calc(100% + 2px);left:0;min-width:100%;
  max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--rule);
  border-radius:3px;box-shadow:0 8px 22px rgba(0,0,0,.16);padding:3px}
.cb .opt{padding:5px 9px;border-radius:2px;font-size:13.5px;cursor:pointer;
  display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.cb .opt:hover,.cb .opt.cur{background:var(--navy-soft)}
.cb .opt .sub{color:var(--ink-3);font-size:11.5px;margin-left:auto;padding-left:12px}
.cb .opt .lv{color:var(--ink-3);font-size:11px;border:1px solid var(--rule);
  border-radius:2px;padding:0 4px}
.cb .none{padding:7px 9px;color:var(--ink-3);font-size:13px}
.cb .hd{padding:5px 9px 3px;color:var(--ink-3);font-size:11.5px;font-weight:700;
  border-top:1px solid var(--rule-2);margin-top:3px}
.cb .hd:first-child{border-top:none;margin-top:0}

/* ---------- 統計 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:16px}
.stat{background:var(--surface);padding:11px 14px}
.stat .v{font-size:23px;font-weight:700;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.stat.bad .v{color:var(--stop)} .stat.good .v{color:var(--ok)} .stat.hi .v{color:var(--buoy)}

/* ---------- 隊伍卡 ---------- */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px}
.team{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  border-top:3px solid var(--navy);padding:11px 13px}
.team.night{border-top-color:var(--night)}
.team.painter{border-top-color:var(--ink-3);opacity:.9}
.team.bad{border-color:var(--stop)}
.team .th{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.team .tn{font-weight:700;font-size:15px}
.team .tv{font-size:11.5px;color:var(--ink-3)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0 7px}
.tag{font-size:11px;padding:0 7px;border-radius:2px;background:var(--sunk);color:var(--ink-2)}
.tag.n{background:var(--night-soft);color:var(--night)}
.tag.p{background:var(--buoy-soft);color:var(--buoy)}
.tag.full{background:var(--stop-soft);color:var(--stop);font-weight:700}
.tag.wt{background:var(--navy);color:var(--surface);font-weight:700;font-size:11.5px;padding:1px 9px}
.tag.sup{background:var(--warn-soft);color:var(--warn)}
.turbs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;padding-top:7px;
  border-top:1px dashed var(--rule)}
.turbs .lbl{font-size:11px;color:var(--ink-3);align-self:center;margin-right:2px}
.turb{font-size:11.5px;font-weight:700;letter-spacing:.02em;border:1px solid var(--rule);
  background:var(--sunk);color:var(--ink-2);border-radius:3px;padding:1px 8px;cursor:pointer}
.turb:hover{border-color:var(--navy);color:var(--navy)}
.turb.on{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.turb .n{font-weight:400;opacity:.75;margin-left:4px}
.faults{margin-top:7px;background:var(--sunk);border-radius:3px;padding:9px 12px;font-size:12.5px;
  line-height:1.7;color:var(--ink-2)}
.faults .fh{font-weight:700;color:var(--ink);margin-bottom:3px}
.faults ul{margin:0;padding-left:17px}
.faults li{margin-bottom:3px}
.faults .meta{color:var(--ink-3);font-size:11px}
.mem{display:flex;align-items:baseline;gap:6px;font-size:13.5px;padding:1px 0;flex-wrap:wrap}
.mem .lv{font-size:10.5px;color:var(--ink-3);border:1px solid var(--rule);
  border-radius:2px;padding:0 4px}
.mem.struck .nm{text-decoration:line-through;color:var(--ink-3)}
.mem.out .nm{color:var(--ink-3);font-style:italic}
.mem.unmatched .nm{color:var(--buoy);border-bottom:1px dashed var(--buoy)}
.cmt{margin-top:7px;padding-top:6px;border-top:1px dashed var(--rule);
  font-size:12px;color:var(--ink-3)}

/* ---------- 草稿列 ---------- */
.slot{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.slot .cb{flex:1;min-width:0}
.slot .why{font-size:11px;color:var(--ink-3);white-space:nowrap;max-width:96px;
  overflow:hidden;text-overflow:ellipsis}
.slot .why.auto{color:var(--ok)}
.slot .rm{border:1px solid var(--rule);background:var(--surface);color:var(--ink-3);
  border-radius:2px;font-size:11px;padding:2px 6px;flex:none}
.slot.lead .cb>input{border-color:var(--navy)}
.slotlbl{font-size:10.5px;color:var(--navy);border:1px solid var(--navy);border-radius:2px;
  padding:0 4px;flex:none}
.addrow{margin-top:5px}
.addrow button{border:1px dashed var(--rule);background:none;color:var(--ink-2);
  border-radius:3px;font-size:12.5px;padding:3px 10px;width:100%}
.fixedmem{font-size:13px;color:var(--ink-3);font-style:italic;padding:2px 0}

/* ---------- 問題 ---------- */
.issue{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--ink-3);
  padding:11px 14px;margin-bottom:8px;border-radius:3px}
.issue.stop{border-left-color:var(--stop)}
.issue.warn{border-left-color:var(--warn)}
.issue.info{border-left-color:var(--navy)}
.issue .lvl{font-size:11px;font-weight:700;padding:0 7px;border-radius:2px;margin-right:8px}
.issue.stop .lvl{background:var(--stop-soft);color:var(--stop)}
.issue.warn .lvl{background:var(--warn-soft);color:var(--warn)}
.issue.info .lvl{background:var(--navy-soft);color:var(--navy)}
.issue .fix{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.issue .fix::before{content:"建議 · ";color:var(--ink-3)}
.livebar{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  padding:10px 14px;margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.livebar .n{font-weight:700}
.livebar .n.bad{color:var(--stop)} .livebar .n.ok{color:var(--ok)} .livebar .n.wr{color:var(--warn)}

.cols{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
@media(max-width:1050px){.cols{grid-template-columns:1fr}}
.side{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:12px 14px;
  position:sticky;top:96px;max-height:calc(100vh - 116px);overflow:auto}
.grp{margin-bottom:12px}
.grp .gh{font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;
  justify-content:space-between;gap:6px;border-bottom:1px solid var(--rule-2);
  padding-bottom:3px;margin-bottom:4px}
.grp .gh .c{color:var(--ink-3);font-weight:400}
.pl{font-size:13px;line-height:1.6;color:var(--ink-2)}
.pl .p{display:inline-block;margin:1px 5px 1px 0;white-space:nowrap}
.pl .p .lv{font-size:10px;color:var(--ink-3)}

.act{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{background:var(--navy);color:var(--surface);border:none;border-radius:3px;
  padding:8px 18px;font-size:14px;font-weight:500}
.btn.ghost{background:none;border:1px solid var(--rule);color:var(--ink-2)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.note{background:var(--buoy-soft);border-left:3px solid var(--buoy);padding:11px 14px;
  border-radius:3px;margin-bottom:14px;font-size:13.5px}
.saved{font-size:12.5px;color:var(--ok)}
.err{background:var(--stop-soft);color:var(--stop);padding:12px 15px;border-radius:3px;
  margin-bottom:14px}

/* ---------- 設定 ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  padding:14px 16px;margin-bottom:12px}
.card .hint{font-size:12.5px;color:var(--ink-3);margin:-4px 0 10px;max-width:76ch}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 10px;
  max-height:250px;overflow:auto;border:1px solid var(--rule-2);padding:8px;border-radius:3px}
.chk label{display:flex;gap:6px;align-items:center;font-size:13px;padding:1px 0}
.chk.wide{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.chk.wide label>span:first-of-type{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk.wide .tri{margin-left:auto;flex:none}
.chk label .lv{font-size:10.5px;color:var(--ink-3)}
.chk label .gp{font-size:10.5px;color:var(--ink-3);margin-left:auto}
.tri{display:flex;gap:3px}
.tri button{font-size:11.5px;padding:1px 7px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink-3);border-radius:2px}
.tri button.on{background:var(--navy);color:var(--surface);border-color:var(--navy)}
.pairs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pairs .cb{min-width:220px}
.pl-list{display:flex;gap:6px;flex-wrap:wrap}
.pair{font-size:12.5px;background:var(--sunk);border-radius:12px;padding:2px 10px}
.pair button{border:none;background:none;color:var(--stop);margin-left:5px;padding:0}
.ordlist{border:1px solid var(--rule-2);border-radius:3px;max-height:230px;overflow:auto}
.ordlist div{display:flex;align-items:center;gap:8px;padding:3px 9px;font-size:13px;
  border-bottom:1px solid var(--rule-2)}
.ordlist div:last-child{border-bottom:none}
.ordlist .idx{color:var(--ink-3);font-size:11.5px;width:20px}
.ordlist button{border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);
  border-radius:2px;font-size:11px;padding:0 6px;margin-left:auto}

/* ---------- 留言 ---------- */
/* ---------- 下兩輪 ---------- */
.wk{margin-bottom:18px}
.wk h3{font-size:15px;color:var(--ink);margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
.wk h3 .sub{font-size:12.5px;color:var(--ink-3);font-weight:400}
.dayrow{display:grid;grid-template-columns:118px 1fr repeat(4,minmax(72px,88px)) 78px;
  gap:8px;align-items:center;background:var(--surface);border:1px solid var(--rule);
  border-radius:4px;padding:8px 12px;margin-bottom:5px;font-size:13.5px}
.dayrow.head{background:var(--sunk);border-color:var(--rule);font-size:11.5px;
  color:var(--ink-3);font-weight:700}
.dayrow.bad{border-left:3px solid var(--stop)}
.dayrow.warnrow{border-left:3px solid var(--warn)}
.dayrow.okrow{border-left:3px solid var(--ok)}
.dayrow .d{font-weight:700;font-variant-numeric:tabular-nums}
.dayrow .d span{font-weight:400;color:var(--ink-3);margin-left:5px;font-size:12px}
.dayrow .n{text-align:right;font-variant-numeric:tabular-nums}
.dayrow .n.bad{color:var(--stop);font-weight:700}
.dayrow .n.wr{color:var(--warn);font-weight:700}
.dayrow .n.ok{color:var(--ok)}
.dayrow .info{color:var(--ink-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
@media(max-width:900px){.dayrow{grid-template-columns:1fr 1fr;grid-auto-rows:auto}}

.snap{background:var(--sunk);border-radius:3px;padding:10px 13px;font-size:12.5px;
  color:var(--ink-2);line-height:1.8;margin:10px 0}
.snap b{color:var(--ink)}
.msglist{margin-top:12px}
.msgitem{border:1px solid var(--rule);border-radius:4px;padding:11px 14px;margin-bottom:9px;
  background:var(--surface)}
.msgitem .mh{font-size:11.5px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;
  align-items:center;margin-bottom:5px}
.msgitem .mb{white-space:pre-wrap;font-size:13.5px}
.msgitem .mrm{border:none;background:none;color:var(--stop);font-size:11.5px;margin-left:auto}
textarea.big{width:100%;min-height:110px;line-height:1.6}
</style>
</head>
<body>

<!-- ================= 開場 ================= -->
<div id="start" class="start">
  <h1>雲林排班工具</h1>
  <p>把 <b>人力總表</b> 和 <b>每日出海計畫</b> 兩個 Excel 拖進來就可以開始。
     檔案只在這台電腦的瀏覽器裡處理,<b>不會上傳到任何地方,也不會改到你的 Excel</b>。</p>
  <div class="drop" id="drop">
    <div class="big">把兩個 Excel 拖到這裡</div>
    <div class="sm">或按下面的按鈕挑檔案(可以一次選兩個)</div>
    <input type="file" id="picker" accept=".xlsx" multiple style="display:none">
    <button class="btn" id="pickbtn">選擇檔案</button>
    <div style="max-width:360px;margin:18px auto 0;text-align:left">
      <div class="filerow"><span class="dot" id="d1"></span><span id="n1">人力總表　尚未選取</span></div>
      <div class="filerow"><span class="dot" id="d2"></span><span id="n2">每日出海計畫　尚未選取</span></div>
    </div>
  </div>
  <div class="progress" id="prog"></div>
  <div class="warnbox hide" id="startwarn"></div>
</div>

<!-- ================= 主畫面 ================= -->
<div id="app" class="hide">
  <div class="top">
    <span class="brand">雲林排班工具</span>
    <span class="files" id="files"></span>
    <span class="spacer"></span>
    <span class="datepick">
      <button class="btn ghost" id="prev">◀</button>
      <span id="dateCb"></span>
      <button class="btn ghost" id="next">▶</button>
      <button class="btn ghost" id="swap">換總表</button>
      <button class="btn ghost" id="reload">全部重來</button>
    </span>
  </div>

  <div class="nav">
    <button data-tab="overview" class="on">總覽</button>
    <button data-tab="plan">排班</button>
    <button data-tab="ahead">下兩輪<span class="badge hide" id="abadge">0</span></button>
    <button data-tab="issues">檢核<span class="badge hide" id="ibadge">0</span></button>
    <button data-tab="settings">設定</button>
    <button data-tab="notes">留言</button>
  </div>

  <div class="wrap">
    <div id="err" class="err hide"></div>

    <div id="tab-overview">
      <div class="stats" id="stats"></div>
      <div class="act" style="margin-bottom:10px">
        <span style="font-size:13px;color:var(--ink-3)">名單(1. 2. 3. 用檔案裡的本名+英文名)</span>
        <button class="btn ghost sm" data-list="scheduled" data-box="#listbox1">班表已排的人</button>
        <button class="btn ghost sm" data-list="available" data-box="#listbox1">總表可出海的人</button>
      </div>
      <textarea id="listbox1" class="big hide" readonly style="margin-bottom:14px;font-size:12.5px"></textarea>
      <div id="wnote"></div>
      <div class="teams" id="teams"></div>
    </div>

    <div id="tab-plan" class="hide">
      <div class="act">
        <button class="btn" id="gen">一鍵產生這一天的草稿</button>
        <span style="font-size:13px;color:var(--ink-3)">基準日</span>
        <span id="baseCb"></span>
        <button class="btn ghost sm" id="dropdraft">丟掉這一天的草稿</button>
        <button class="btn ghost sm" id="copyall">複製全部隊伍</button>
        <button class="btn ghost sm" data-list="scheduled" data-box="#copybox">已排名單 1.2.3.</button>
        <button class="btn ghost sm" data-list="available" data-box="#copybox">可出海名單 1.2.3.</button>
        <button class="btn sm" id="exportplan">存成新的出海計畫(到這一天為止)</button>
        <button class="btn ghost sm" id="exportx">存成簡表</button>
        <span class="saved hide" id="gmsg"></span>
      </div>
      <div id="livebar" class="livebar hide"></div>
      <div id="returning"></div>
      <div class="cols">
        <div class="teams" id="dteams"></div>
        <div class="side">
          <h3>草稿的問題(改一個人就重算)</h3>
          <div id="draftIssues" style="font-size:13px"></div>
          <h3 style="margin-top:14px">不能排的人</h3>
          <div class="pl" id="unsched"></div>
        </div>
      </div>
      <textarea id="copybox" class="big hide" readonly style="margin-top:14px;font-size:12.5px"></textarea>
    </div>

    <div id="tab-ahead" class="hide">
      <div class="act">
        <button class="btn" id="exportAhead">所有草稿存成一個 Excel</button>
        <button class="btn ghost sm" id="regenAhead">重新產生全部</button>

/* ---------------------------------------------------------------- zip */
async function inflateRaw(bytes) {
  const ds = new DecompressionStream("deflate-raw");
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
}
function readZipIndex(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--)
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("這個檔案不是有效的 xlsx(找不到 zip 結尾)");
  let count = dv.getUint16(eocd + 10, true), cdOff = dv.getUint32(eocd + 16, true);
  if (cdOff === 0xFFFFFFFF || count === 0xFFFF) {
    for (let i = eocd - 20; i >= 0; i--)
      if (dv.getUint32(i, true) === 0x07064b50) {
        const z64 = Number(dv.getBigUint64(i + 8, true));
        count = Number(dv.getBigUint64(z64 + 32, true));
        cdOff = Number(dv.getBigUint64(z64 + 48, true));
        break;
      }
  }
  const dec = new TextDecoder("utf-8"), idx = {};
  let p = cdOff;
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), crc = dv.getUint32(p + 16, true);
    const csize = dv.getUint32(p + 20, true), usize = dv.getUint32(p + 24, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true);
    const clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    idx[dec.decode(u8.subarray(p + 46, p + 46 + nlen))] = { method, csize, usize, crc, lho };
    p += 46 + nlen + elen + clen;
  }
  return { u8, dv, idx };
}
async function readPart(zip, name) {
  const e = zip.idx[name];
  if (!e) return "";
  const { dv, u8 } = zip;
  if (dv.getUint32(e.lho, true) !== 0x04034b50) throw new Error("zip 區塊損壞:" + name);
  const nlen = dv.getUint16(e.lho + 26, true), elen = dv.getUint16(e.lho + 28, true);
  const start = e.lho + 30 + nlen + elen;
  const raw = u8.subarray(start, start + e.csize);
  return new TextDecoder("utf-8").decode(e.method === 0 ? raw : await inflateRaw(raw));
}

/* ---------------------------------------------------------------- 產生 xlsx

   只寫一份全新的小檔案,原本那兩個 Excel 從頭到尾都不會被開啟寫入。
   zip 用 stored(不壓縮),所以只需要自己算 CRC32,不必實作 deflate。
   ---------------------------------------------------------------- */
const crc32 = (() => {
  const tbl = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    tbl[n] = c >>> 0;
  }
  return bytes => {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = tbl[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };
})();

function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  for (const [name, text] of files) {
    const nb = enc.encode(name), db = enc.encode(text), crc = crc32(db);
    const lh = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0), ...u32(crc), ...u32(db.length), ...u32(db.length),
      ...u16(nb.length), ...u16(0)]);
    parts.push(lh, nb, db);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0),
      ...u16(0), ...u16(0), ...u16(0), ...u32(crc), ...u32(db.length), ...u32(db.length),
      ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0),
      ...u32(offset), ...nb]));
    offset += lh.length + nb.length + db.length;
  }
  const cdSize = central.reduce((n, c) => n + c.length, 0);
  const eocd = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(central.length), ...u16(central.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
  return new Blob([...parts, ...central, eocd],
                  { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

const xEsc = v => String(v ?? "").replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
const colName = n => { let s = ""; while (n > 0) { const r = (n-1) % 26;
  s = String.fromCharCode(65+r) + s; n = (n - r - 1) / 26; } return s; };

/* rows: [[值, 值, …], …];值是字串或數字,null 代表空格 */
function makeXlsx(sheetName, rows, widths) {
  const body = rows.map((cells, ri) => {
    const r = ri + 1;
    const cs = cells.map((v, ci) => {
      if (v === null || v === undefined || v === "") return "";
      const ref = colName(ci + 1) + r;
      if (typeof v === "number" && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xEsc(v)}</t></is></c>`;
    }).join("");
    return `<row r="${r}">${cs}</row>`;
  }).join("");
  const cols = (widths || []).map((w, i) =>
    `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");
  const sheet =
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">` +
    (cols ? `<cols>${cols}</cols>` : "") + `<sheetData>${body}</sheetData></worksheet>`;
  return zipStore([
    ["[Content_Types].xml",
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
      `<Default Extension="xml" ContentType="application/xml"/>` +
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
      `<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>` +
      `</Types>`],
    ["_rels/.rels",
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>` +
      `</Relationships>`],
    ["xl/workbook.xml",
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ` +
      `xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">` +
      `<sheets><sheet name="${xEsc(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels",
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>` +
      `</Relationships>`],
    ["xl/worksheets/sheet1.xml", sheet],
  ]);
}

/* ---------------------------------------------------------------- xlsx */
const stripTags = s => s.replace(/<[^>]+>/g, "");
const unesc = s => s.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"')
                    .replace(/&apos;/g,"'").replace(/&amp;/g,"&");
const colNum = c => { let n = 0; for (const ch of c) n = n*26 + (ch.charCodeAt(0)-64); return n; };
function serialToDate(v) {
  const f = parseFloat(v);
  if (!(f > 20000 && f < 80000)) return null;
  return new Date(Date.UTC(1899,11,30) + Math.floor(f)*86400000).toISOString().slice(0,10);
}
function addDays(iso, n) {
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}

class Book {
  static async open(file, onProgress) {
    const b = new Book();
    b.name = file.name;
    onProgress && onProgress(`讀取 ${file.name}…`);
    b.zip = readZipIndex(new Uint8Array(await file.arrayBuffer()));
    const wbx = await readPart(b.zip, "xl/workbook.xml");
    const rels = await readPart(b.zip, "xl/_rels/workbook.xml.rels");
    b.parts = {};
    for (const m of wbx.matchAll(/<sheet name="([^"]+)"[^>]*?r:id="(rId\d+)"/g)) {
      const t = rels.match(new RegExp(`Id="${m[2]}"[^>]*?Target="([^"]+)"`));
      if (t) b.parts[unesc(m[1])] = "xl/" + t[1].replace(/^\//, "");
    }
    b.sheetNames = Object.keys(b.parts);
    return b;
  }
  /* 只解壓真正要用的分頁 —— 這兩個活頁簿裡有 570MB 和 105MB 的分頁我們從來不碰。 */
  async prepare(onProgress) {
    onProgress && onProgress(`解析 ${this.name} 的文字與樣式…`);
    this.shared = [];
    const ss = await readPart(this.zip, "xl/sharedStrings.xml");
    for (const m of ss.matchAll(/<si>([\s\S]*?)<\/si>/g)) {
      const si = m[1], runs = [...si.matchAll(/<r>([\s\S]*?)<\/r>/g)];
      if (!runs.length) { const t = unesc(stripTags(si)); this.shared.push([t,t,[]]); continue; }
      let keep = "", full = "", struck = [];
      for (const r of runs) {
        const body = r[1], pr = body.match(/<rPr>([\s\S]*?)<\/rPr>/);
        const t = unesc(stripTags(body.replace(/<rPr>[\s\S]*?<\/rPr>/, "")));
        full += t;
        if (pr && /<strike\s*\/>/.test(pr[1])) struck.push(t); else keep += t;
      }
      this.shared.push([keep, full, struck]);
    }
    const st = await readPart(this.zip, "xl/styles.xml");
    const fx = st.match(/<fonts[^>]*>([\s\S]*?)<\/fonts>/);
    const fonts = fx ? (fx[1].match(/<font>[\s\S]*?<\/font>|<font\s*\/>/g) || []) : [];
    this.fontStrike = fonts.map(f => /<strike\s*\/>/.test(f));
    const cx = st.match(/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/);
    const xfs = cx ? (cx[1].match(/<xf [^>]*?\/>|<xf [^>]*?>[\s\S]*?<\/xf>/g) || []) : [];
    this.xfFont = xfs.map(x => { const m = x.match(/fontId="(\d+)"/); return m ? +m[1] : 0; });
  }
  async sheet(name, maxCol) {
    const data = await readPart(this.zip, this.parts[name]);
    const cells = new Map();
    const hidden = new Set();
    let maxRow = 0, mc = 0;
    for (const rm of data.matchAll(/<row r="(\d+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g)) {
      const rn = +rm[1], body = rm[3] || "";
      // AOC 把不要參考的資料藏起來(不能刪但也不該排),所以隱藏列一律跳過
      if (/hidden="(1|true)"/.test(rm[2])) hidden.add(rn);
      if (rn > maxRow) maxRow = rn;
      for (const cm of body.matchAll(/<c r="([A-Z]+)\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
        const cn = colNum(cm[1]);
        if (maxCol && cn > maxCol) continue;
        const attrs = cm[2], inner = cm[3] || "";
        const sm = attrs.match(/s="(\d+)"/), sidx = sm ? +sm[1] : 0;
        let value = "", raw = "", struck = [];
        if (attrs.includes('t="s"')) {
          const vm = inner.match(/<v>(\d+)<\/v>/);
          if (vm) { const s = this.shared[+vm[1]]; if (s) { value = s[0]; raw = s[1]; struck = s[2]; } }
        } else if (attrs.includes('t="inlineStr"') || inner.includes("<is>")) {
          value = raw = unesc(stripTags(inner));
        } else {
          const vm = inner.match(/<v>([\s\S]*?)<\/v>/);
          if (vm) value = raw = unesc(vm[1]);
        }
        const fid = this.xfFont[sidx] ?? 0;
        if (value && this.fontStrike[fid]) { struck = struck.concat([value]); value = ""; }
        if (value || raw) { cells.set(rn*1000 + cn, { value, raw, struck }); if (cn > mc) mc = cn; }
      }
    }
    return { maxRow, maxCol: mc, hidden,
      cell: (r,c) => cells.get(r*1000+c) || { value:"", raw:"", struck:[] },
      val:  (r,c) => (cells.get(r*1000+c) || { value:"" }).value.trim() };
  }
}

/* 取出某個 zip 區塊「壓縮後」的原始位元組 —— 搬運時完全不重新壓縮 */
function rawEntry(zip, name) {
  const e = zip.idx[name], { dv, u8 } = zip;
  const nlen = dv.getUint16(e.lho + 26, true), elen = dv.getUint16(e.lho + 28, true);
  const start = e.lho + 30 + nlen + elen;
  return u8.subarray(start, start + e.csize);
}

/* 重建 xlsx:除了 replacements 指定的區塊,其他一律原封搬運(不解壓也不重壓)。
   所以顏色、圖片、其他 16 個分頁、公式全部一個位元組都不會變。
   原始檔案本身從頭到尾只被讀取,這裡產生的是另一個新檔。 */
async function rebuildXlsx(zip, replacements) {
  const enc = new TextEncoder();
  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  const parts = [], central = [];
  let offset = 0;

  for (const name of Object.keys(zip.idx)) {
    let method, crc, csize, usize, data;
    if (Object.prototype.hasOwnProperty.call(replacements, name)) {
      const raw = enc.encode(replacements[name]);
      usize = raw.length; crc = crc32(raw);
      if (typeof CompressionStream === "function") {
        const cs = new CompressionStream("deflate-raw");
        data = new Uint8Array(await new Response(
          new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer());
        method = 8;
      } else { data = raw; method = 0; }
      csize = data.length;
    } else {
      const e = zip.idx[name];
      method = e.method; crc = e.crc; csize = e.csize; usize = e.usize;
      data = rawEntry(zip, name);
    }
    const nb = enc.encode(name);
    parts.push(new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(method),
      ...u16(0), ...u16(0), ...u32(crc), ...u32(csize), ...u32(usize),
      ...u16(nb.length), ...u16(0)]), nb, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0),
      ...u16(method), ...u16(0), ...u16(0), ...u32(crc), ...u32(csize), ...u32(usize),
      ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0),
      ...u32(offset), ...nb]));
    offset += 30 + nb.length + csize;
  }
  const cdSize = central.reduce((n, c) => n + c.length, 0);
  central.push(new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(central.length), ...u16(central.length), ...u32(cdSize), ...u32(offset), ...u16(0)]));
  return new Blob([...parts, ...central],
    { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

/* ---------- 逐格改寫 sheet XML(保留每一格原本的樣式 s=) ---------- */
const CIDX = { A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,J:10,K:11,L:12,M:13,N:14 };

function editRow(rowXml, rowNum, edits) {
  let out = rowXml;
  for (const [col, e] of Object.entries(edits)) {
    const re = new RegExp(`<c r="${col}${rowNum}"([^>]*?)(?:/>|>([\\s\\S]*?)</c>)`);
    const m = out.match(re);
    const attrs = m ? m[1].replace(/\s*t="[^"]*"/g, "") : "";
    let cell;
    if (e.clear) cell = `<c r="${col}${rowNum}"${attrs}/>`;
    else if (e.num !== undefined) cell = `<c r="${col}${rowNum}"${attrs}><v>${e.num}</v></c>`;
    else cell = `<c r="${col}${rowNum}"${attrs} t="inlineStr">` +
                `<is><t xml:space="preserve">${xEsc(e.text)}</t></is></c>`;
    if (m) { out = out.slice(0, m.index) + cell + out.slice(m.index + m[0].length); continue; }
    if (e.clear) continue;
    // 這一欄原本沒有儲存格 → 照欄序插進去
    let pos = -1;
    for (const cm of out.matchAll(/<c r="([A-Z]+)\d+"/g))
      if ((CIDX[cm[1]] || 99) > CIDX[col]) { pos = cm.index; break; }
    out = pos >= 0 ? out.slice(0, pos) + cell + out.slice(pos)
                   : out.replace(/<\/row>$/, cell + "</row>");
  }
  return out;
}

/* 成員平均分到原本那幾列,維持原檔一列放幾個人的樣子 */
function spread(names, rowCount) {
  const out = new Array(rowCount).fill("");
  if (!names.length || rowCount <= 0) return out;
  const per = Math.ceil(names.length / rowCount);
  for (let i = 0; i < rowCount; i++) {
    const chunk = names.slice(i * per, (i + 1) * per);
    out[i] = chunk.join(", ") + (chunk.length && (i + 1) * per < names.length ? "," : "");
  }
  return out;
}

/* ---------------------------------------------------------------- 姓名 */
const clean = s => String(s).toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
/* 括號內容是註記(不是英文通稱)嗎 */
const isNameTag = t => !t || t.toUpperCase() === t || R.TAGS.has(t.toUpperCase());
// 班表把等級寫在名字後面,可能用「-」也可能只用空白:Graeme.Bissett-ST / Graeme ST
const LEVEL_RE = new RegExp("[-\\s](" + R.OFFSHORE.concat(R.SHORE).join("|") + ")$", "i");

function rosterKeys(name) {
  let s = name.trim();
  for (const suf of R.COMPANY_SUFFIX) s = s.replace(new RegExp("-" + suf + "$","i"), "");
  const paren = [...s.matchAll(/\(([^)]*)\)/g)].map(m => m[1].trim());
  const base = s.replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim();
  const nicks = paren.filter(p => !isNameTag(p));
  const keys = new Set();
  if (base.includes(",")) {
    const i = base.indexOf(",");
    const fam = base.slice(0,i).trim(), given = base.slice(i+1).trim();
    for (const g of [given, ...nicks]) if (g) { keys.add(clean(g+" "+fam)); keys.add(clean(fam+" "+g)); }
  } else {
    const parts = base.split(/\s+/);
    if (parts.length >= 2) {
      const fam = parts[parts.length-1];
      for (const g of [parts.slice(0,-1).join(" "), ...nicks]) if (g) keys.add(clean(g+" "+fam));
    } else if (parts[0]) keys.add(clean(parts[0]));
  }
  keys.delete("");
  return keys;
}
function parseToken(tok) {
  let t = tok.trim().replace(/^[,;]+|[,;]+$/g,"");
  let prefix = "";
  const pm = t.match(/^(OT|TT)[-/]\s*/i);
  if (pm) { prefix = pm[1].toUpperCase(); t = t.slice(pm[0].length); }
  let level = "";
  const lm = t.match(LEVEL_RE);
  if (lm) { level = lm[1].toUpperCase(); t = t.slice(0, lm.index); }
  const display = t.replace(/[._]+/g," ").replace(/\s+/g," ").trim();
  return { display, prefix, level, key: clean(display) };
}
function fuzzy(key, index) {
  let best = null, bestScore = 0;
  for (const k of index.keys()) {
    if (Math.abs(k.length - key.length) > 3) continue;
    let same = 0;
    const used = new Array(key.length).fill(false);
    for (const ch of k) {
      const j = [...key].findIndex((c,i) => !used[i] && c === ch);
      if (j >= 0) { used[j] = true; same++; }
    }
    const score = (2*same) / (k.length + key.length);
    if (score > bestScore) { bestScore = score; best = k; }
  }
  return bestScore >= 0.88 ? index.get(best) : null;
}

/* ---------------------------------------------------------------- 名冊 */
class Roster {
  static async build(book, onProgress) {
    const o = new Roster();
    const cands = book.sheetNames.filter(n => /^allowance/i.test(n)).sort();
    if (!cands.length) throw new Error("這個檔案裡沒有 Allowance 分頁,不像是人力總表");
    o.sheetName = cands[cands.length-1];
    onProgress && onProgress(`讀取 ${o.sheetName}…`);
    const sh = await book.sheet(o.sheetName, 420);
    o.sh = sh;
    o.dateCol = new Map();
    for (let c = 5; c <= sh.maxCol; c++) {
      const d = serialToDate(sh.val(1,c));
      if (d) o.dateCol.set(d, c);
    }
    o.people = []; o.hiddenPeople = [];
    let group = "";
    for (let r = 4; r <= sh.maxRow; r++) {
      const lvl = sh.val(r,3), nm = sh.val(r,4);
      if (nm && !lvl && !sh.val(r,2)) { group = nm; continue; }
      if (!lvl || !nm) continue;
      const person = { row:r, name:nm, level:lvl.toUpperCase(), group,
                       hidden: sh.hidden.has(r) };
      /* 隱藏 = AOC 標記「資料要留著但不要用」。
         還是放進姓名索引,舊班表才認得出這個人是誰;
         但不進可派工名冊,所以不會被排、也不算進任何人數。 */
      (person.hidden ? o.hiddenPeople : o.people).push(person);
    }
    o.everyone = o.people.concat(o.hiddenPeople);
    o.byName = new Map(o.everyone.map(p => [p.name, p]));
    o.index = new Map();
    for (const p of o.people) for (const k of rosterKeys(p.name)) if (!o.index.has(k)) o.index.set(k,p);
    for (const p of o.hiddenPeople) for (const k of rosterKeys(p.name)) if (!o.index.has(k)) o.index.set(k,p);
    // 只寫名字的寫法(班表出現過 "Graeme"、"Graeme ST"),全場只有一個人叫這個名字才認
    const givenSets = new Map();
    for (const p of o.everyone) for (const k of rosterKeys(p.name)) {
      const g = k.split(" ")[0];
      if (!g) continue;
      if (!givenSets.has(g)) givenSets.set(g, new Set());
      givenSets.get(g).add(p.name);
    }
    o.givenIndex = new Map();
    for (const [g,set] of givenSets) if (set.size === 1) o.givenIndex.set(g, o.byName.get([...set][0]));
    for (const [k,t] of Object.entries({ ...R.FORCED, ...R.MANUAL })) {
      const hit = o.byName.get(t);
      if (hit) o.index.set(clean(k), hit);
    }
    o.zoneCache = new Map(); o.findCache = new Map(); o.availCache = new Map();
    /* TSWA 總表填到哪一天 —— 之後的空白才有「推定照常出海」的問題 */
    o.bladeEdge = "";
    for (const p of o.people) if (isBladeLevel(p.level))
      for (const [d, c] of o.dateCol) if (sh.val(p.row, c) && d > o.bladeEdge) o.bladeEdge = d;
    return o;
  }
  isOffshore(p){ return R.OFFSHORE.includes(p.level.toUpperCase()); }
  isSupport(p){ return R.SUPPORT.includes(p.level.toUpperCase()); }
  canLead(p){ return R.LEADER.includes(p.level.toUpperCase()); }
  hasF(p){ return R.F_LEVELS.includes(p.level.toUpperCase()); }
  code(p, day){ const c = this.dateCol.get(day); return c ? this.sh.val(p.row,c) : ""; }
  /* 往前找這個人最近一次有填的代碼(最多 back 天) */
  lastCode(p, day, back) {
    for (let i = 1; i <= back; i++) {
      const d = addDays(day, -i), v = (this.code(p, d) || "").trim();
      if (v) return { date:d, code:v };
    }
    return null;
  }
  /* [V] TSWA 不做 7 休 7,8 個人天天出海;總表卻只填到眼前幾天(9/12 的檔只填到 9/20),
     再往後整排空白 —— 但出海計畫 9/21 照樣排了 8 位。
     [U] 使用者決定:空白就是空白,不替他們猜;只在檢核提醒「總表還沒填到這天」,看到再補。
     這裡回傳「總表填到的最後一天還在上班、但這一天空白」的 TSWA。 */
  bladeUnfilled(day) {
    const edge = this.bladeEdge;
    if (!edge || day <= edge) return [];
    const gap = Math.round((new Date(day) - new Date(edge)) / 86400000);
    if (gap > 28) return [];
    return this.people.filter(p => {
      if (!isBladeLevel(p.level) || this.code(p, day)) return false;
      const back = this.lastCode(p, day, gap + 2);
      const up = back ? back.code.toUpperCase() : "";
      return back && (up === "W" || up === "OF" || up === "ON" || R.OFFSHORE.includes(up));
    });
  }
  /* 比對順序:完整吻合 → 前綴唯一("Graeme B")→ 只有名且唯一("Graeme")→ 模糊(拼法差異) */
  find(key) {
    if (!key) return null;
    if (this.findCache.has(key)) return this.findCache.get(key);
    let p = this.index.get(key) || null;
    if (!p && key.length >= 4) {
      const hits = [...this.index.keys()].filter(k => k.startsWith(key));
      const uniq = new Set(hits.map(k => this.index.get(k).name));
      if (uniq.size === 1) p = this.index.get(hits[0]);
    }
    if (!p) p = this.givenIndex.get(key) || null;
    if (!p) p = fuzzy(key, this.index);
    this.findCache.set(key, p || null);
    return p || null;
  }
  zone(day) {
    if (this.zoneCache.has(day)) return this.zoneCache.get(day);
    const c = this.dateCol.get(day);
    let out;
    if (!c) out = { zone:"missing", of:0, on:0 };
    else {
      let of=0,on=0,lv=0;
      for (const p of this.people) {
        const v = this.sh.val(p.row,c).toUpperCase();
        if (v === "OF") of++; else if (v === "ON") on++;
        else if (R.OFFSHORE.includes(v)) lv++;
      }
      out = (of === 0 && on >= R.WEATHER_ON) ? { zone:"weather_off", of, on }
          : { zone:(of+on > lv ? "history" : "plan"), of, on };
    }
    this.zoneCache.set(day, out);
    return out;
  }
  avail(p, day) {
    const ck = p.name + "|" + day;
    if (this.availCache.has(ck)) return this.availCache.get(ck);
    const code = (this.code(p,day) || "").trim();
    let out;
    if (p.hidden) out = { ok:false, cat:"hidden", why:"總表裡已隱藏,不再排班", code };
    else if (!this.isOffshore(p) && !this.isSupport(p))
      out = { ok:false, cat:"shore", why:`岸上職務(${p.level})`, code };
    else if (!code) out = { ok:false, cat:R.BLANK[0], why:R.BLANK[1], code:"" };
    else {
      const hit = R.CODE[code] || R.CODE[code.toLowerCase()] || R.CODE[code.toUpperCase()];
      if (hit) {
        const [cat, why] = hit;
        out = cat === "offshore" ? { ok:true, cat:"offshore", why:"已出海", code }
            : R.OK_CATS.includes(cat)
              ? { ok:true, cat: this.isSupport(p) ? "support" : "available", why, code }
            : { ok:false, cat, why, code };
      } else if (R.OFFSHORE.includes(code.toUpperCase()) || R.SUPPORT.includes(code.toUpperCase()))
        out = { ok:true, cat: this.isSupport(p) ? "support" : "available",
                why: this.isSupport(p) ? `岸上職務(${code}),可支援出海` : `可出海(${code})`, code };
      else out = { ok:false, cat:"other", why:`代碼 ${code}`, code };
    }
    this.availCache.set(ck, out);
    return out;
  }
}

/* ---------------------------------------------------------------- 出海計畫 */
const isOutsider = d => R.OUTSIDERS.some(x => d.toLowerCase().includes(x.toLowerCase()));
/* painter 隊:隊名在清單裡(Snail 3),或工作類型就寫 Paint。
   [V] 全年還有一個隊名直接叫 "Paint" 的隊(24 次,成員全是 IPS,工作類型全是 Paint),
   只認隊名會漏掉它,結果它每次都被當成「隊長不合格」誤報。 */
const isPainterTeam = (name, worktype) =>
  R.PAINTER_TEAMS.some(t => (name||"").toLowerCase().startsWith(t.toLowerCase())) ||
  (worktype||"").toUpperCase().startsWith("PAINT");

class Plan {
  static async build(book, onProgress) {
    const o = new Plan();
    o.sheetName = book.sheetNames.find(n => n.toLowerCase().includes("daily ops"));
    if (!o.sheetName) throw new Error("這個檔案裡沒有 Daily Ops 分頁,不像是每日出海計畫");
    onProgress && onProgress(`讀取 ${o.sheetName}…`);
    const sh = await book.sheet(o.sheetName, 14);
    o.days = new Map();
    const starts = [];
    for (let r = 1; r <= sh.maxRow; r++) {
      if (sh.hidden.has(r)) continue;
      const v = sh.val(r,1);
      if (!v) continue;
      let d = serialToDate(v);
      if (!d) { const m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (m) d = `${m[3]}-${m[2]}-${m[1]}`; }
      if (d) starts.push([r,d]);
    }
    for (let i = 0; i < starts.length; i++) {
      const [r0,d] = starts[i];
      const r1 = i+1 < starts.length ? starts[i+1][0]-1 : sh.maxRow;
      o.days.set(d, Plan.parseDay(sh, d, r0, r1));
      o.hiddenRows = sh.hidden;
    }
    o.dates = [...o.days.keys()].sort();
    o.book = book;                       // 保留原始 zip,產生新檔時要原封搬運其他區塊
    o.part = book.parts[o.sheetName];
    return o;
  }
  static members(sh, r) {
    const cell = sh.cell(r,4), struckKeys = new Set();
    for (const s of cell.struck)
      for (const t of s.split(/[,;+]/)) if (t.trim()) struckKeys.add(clean(parseToken(t).display));
    const out = [];
    for (const tok of (cell.raw || "").split(/[,;+]/)) {
      const t = tok.trim();
      if (!t || t.length > 42 || !/[A-Za-z]/.test(t)) continue;
      const info = parseToken(t);
      if (!info.display) continue;
      out.push({ ...info, struck: struckKeys.has(info.key), row:r, person:null });
    }
    return out;
  }
  static parseDay(sh, d, r0, r1) {
    const day = { date:d, teams:[], blocks:{}, blockRows:{}, weather:"", headRow:r0, endRow:r0 };
    let cur = null;
    const notes = [];
    for (let r = r0+1; r <= r1; r++) {
      if (sh.hidden.has(r)) continue;                 // 隱藏列不參考
      const a = sh.val(r,1), b = sh.val(r,2), c = sh.val(r,3), dd = sh.val(r,4);
      const note = [sh.val(r,13), sh.val(r,14)].filter(Boolean).join(" ");
      // 真正用到的最後一列(最後一天的 r1 會是整張表的 maxRow,不能拿來當結尾)
      for (let cc = 1; cc <= 14; cc++) if (sh.val(r,cc)) { day.endRow = r; break; }
      if (note) notes.push(note);
      if (c) { cur = { date:d, worktype:a, vessel:b, name:c, night:false, headRow:r,
                       rows:[], dRows:[], members:[], works:[], comment:"" }; day.teams.push(cur); }
      if (b && R.NON_SAILING.some(x => x.toLowerCase() === b.trim().toLowerCase())) {
        if (cur && cur.headRow === r) { day.teams.pop(); cur = null; }
        (day.blocks[b.trim()] = day.blocks[b.trim()] || []).push(...Plan.members(sh,r));
        (day.blockRows[b.trim()] = day.blockRows[b.trim()] || []).push(r);   // 寫回 Excel 時要用
        continue;
      }
      if (b && R.NIGHT.some(k => b.toLowerCase().includes(k)) && cur) cur.night = true;
      if (!cur) continue;
      cur.rows.push(r);
      if (note) cur.comment = (cur.comment + " " + note).trim();
      if (dd) { cur.dRows.push(r); cur.members.push(...Plan.members(sh,r)); }
      // 工單:E=ATS Case ID、F=Error Code、G=Turbine、H=Fault description、J=PTW、L=Service Order
      const turbine = sh.val(r,7), fault = sh.val(r,8);
      if (turbine || fault)
        cur.works.push({ turbine, fault, caseId:sh.val(r,5), err:sh.val(r,6),
                         ptw:sh.val(r,10), so:sh.val(r,12) });
    }
    const blob = notes.join(" ").toLowerCase();
    for (const kw of ["wow","cancel","weather day","weather down"])
      if (blob.includes(kw)) { day.weather = kw.toUpperCase(); break; }
    for (const t of day.teams) {
      t.painter = isPainterTeam(t.name, t.worktype);
      t.turbines = groupWorks(t.works || []);
    }
    return day;
  }
}

/* 工單依機組編號分群,同一支機組的故障描述收在一起 */
function groupWorks(works) {
  const map = new Map();
  for (const w of works) {
    const id = (w.turbine || "").trim() || "(未填機組)";
    if (!map.has(id)) map.set(id, []);
    const items = map.get(id);
    const key = (w.fault || "").trim() + "|" + (w.caseId || "") + "|" + (w.ptw || "");
    if (key !== "||" && !items.some(x => (x._k) === key)) { w._k = key; items.push(w); }
    else if (key === "||" && !items.length) { w._k = key; items.push(w); }
  }
  return [...map.entries()].map(([id, items]) => ({ id, items }));
}

/* ================================================================ 檢核核心

   evaluate() 只吃「一份隊伍清單」,不管它是從 Excel 讀來的還是使用者改過的草稿,
   所以總覽跟草稿走的是同一套規則 —— 草稿改一個人就能立刻再跑一次。
   ================================================================ */

function linkNames(plan, roster, day) {
  const d = plan.days.get(day);
  if (!d || d._linked) return;
  for (const t of d.teams)
    for (const m of t.members) if (!isOutsider(m.display)) m.person = roster.find(m.key);
  d._linked = true;
}

function teamsFromPlan(plan, roster, day) {
  if (!plan.days.has(day)) return [];       // 出海計畫還沒建立這一天
  linkNames(plan, roster, day);
  return plan.days.get(day).teams.map(t => ({
    name:t.name, vessel:t.vessel, worktype:t.worktype, night:t.night, painter:t.painter,
    comment:t.comment, turbines:t.turbines || [],
    members: t.members.map(m => ({ person:m.person, display:m.display, level:m.level,
      struck:m.struck, outsider:isOutsider(m.display), prefix:m.prefix })),
  }));
}

function teamsFromDraft(D, roster) {
  return D.teams.map(t => ({
    name:t.name, vessel:t.vessel, worktype:t.worktype, night:t.night, painter:t.painter,
    comment:"", turbines:t.turbines || [],
    members: t.slots.filter(s => s.name || s.fixed).map(s => s.fixed
      ? { person:null, display:s.fixed, level:"", struck:false, outsider:true, prefix:"" }
      : { person:roster.byName.get(s.name) || null, display:s.name, level:"",
          struck:false, outsider:false, prefix:"" }),
  }));
}

const isSupportMember = m => !!(m.person && R.SUPPORT.includes(m.person.level.toUpperCase()));
/* 兩種身分取比較高的那個(岸上職務除外,以總表為準) */
function bestLevel(planLv, rosterLv) {
  const a = (planLv||"").toUpperCase(), b = (rosterLv||"").toUpperCase();
  if (!a) return b; if (!b) return a;
  if (R.SUPPORT.includes(b) || R.SHORE.includes(b)) return b;
  const ia = R.LEVEL_RANK.indexOf(a), ib = R.LEVEL_RANK.indexOf(b);
  if (ia < 0) return b; if (ib < 0) return a;
  return ia <= ib ? a : b;
}
const memberLevel = m => m.person ? bestLevel(m.level, m.person.level) : (m.level || "");
/* 列入「班表已排」核對的人:不含劃掉的、也不含外部支援。
   岸上職務(ST)排到了就算 —— 他人真的在船上。 */
const counted = t => t.members.filter(m => !m.struck && !m.outsider);
const checkable = counted;
const seatsOf = t => t.members.filter(m => !m.struck).length;

function evaluate(teams, roster, day, S) {
  const z = roster.zone(day);
  const issues = [];
  const add = (level,kind,msg,fix,where) => issues.push({ level,kind,msg,fix:fix||"",where:where||"" });
  const excluded = new Set((S.exclude||[]).map(x => x.toLowerCase()));

  const avail = new Map();
  for (const p of roster.people) {
    let a = roster.avail(p, day);
    if (excluded.has(p.name.toLowerCase())) a = { ok:false, cat:"excluded", why:"設定裡排除", code:a.code };
    avail.set(p.name, a);
  }
  /* [U] 代碼 FMS / HL / F2 = 當天不是為雲林工作的技師,
     不能排、也不算進任何人數核對。被排到就單獨提醒一次,不當成一般的派工衝突。 */
  const isAway = m => {
    if (!m.person) return false;
    if (m.person.hidden) return true;                    // 隱藏的人不算
    return (avail.get(m.person.name)||{}).cat === "away";  // FMS / HL / F2
  };
  const crew = t => counted(t).filter(m => !isAway(m));
  const awayHits = [], hiddenHits = [];
  for (const t of teams) for (const m of counted(t)) {
    if (!m.person) continue;
    if (m.person.hidden) hiddenHits.push(`${m.person.name} 在 ${t.name}`);
    else if ((avail.get(m.person.name)||{}).cat === "away")
      awayHits.push(`${m.person.name}(${avail.get(m.person.name).why})在 ${t.name}`);
  }

  const scheduled = new Map();
  for (const t of teams) for (const m of crew(t)) if (m.person) {
    if (!scheduled.has(m.person.name)) scheduled.set(m.person.name, []);
    scheduled.get(m.person.name).push(t.name);
  }
  /* TSWA 總表還沒填到這一天 —— 不替他們猜,只提醒 */
  if (z.zone === "plan") {
    const unfilled = roster.bladeUnfilled(day);
    const notYet = unfilled.filter(p => !scheduled.has(p.name)).map(p => p.name);
    const already = unfilled.filter(p => scheduled.has(p.name)).map(p => p.name);
    if (notYet.length)
      add("warn","tswa_unfilled",
          `TSWA 的總表只填到 ${roster.bladeEdge},這一天還是空白,所以 ${notYet.length} 位排不進草稿:` + notYet.join("、"),
          "TSWA 通常天天出海。請在總表把這幾天填上 w(請假的填 L),按「換總表」重讀就會排進去");
    else if (already.length)
      add("info","tswa_unfilled",
          `TSWA 已經排了 ${already.length} 位,但總表這一天還是空白(只填到 ${roster.bladeEdge})`,
          "班表沒問題,只是總表要記得補填");
  }
  const badTeams = new Set();
  const minTeam = S.min_team ?? 3, cap = S.vessel_capacity ?? R.CAP;
  const seats = new Map();

  for (const t of teams) {
    const k = t.vessel + "|" + t.night;
    seats.set(k, (seats.get(k)||0) + seatsOf(t));
    if (t.painter) continue;                       // [T] Snail 3 不套用任何規則
    const mem = crew(t), n = mem.length;
    const isHV = (t.worktype||"").toUpperCase() === "HV";

    if (n === 0 && (t.turbines||[]).length) {
      add("warn","no_crew",
          `${t.name} 有工作(${t.turbines.map(g=>g.id).join("、")}),但沒有排任何人`,
          "確認是還沒排,還是這一隊今天不出海", t.name);
      badTeams.add(t.name);
    }

    /* ---- TSWA(Muehlhan 葉片組)----
       [U] TSWA 要排在一起、固定偶數,不是偶數就立刻列為要處理。
       [V] 全年掃過:TSWA 兩兩一組跟著 TS/MT 出海是有的(7/16 Lugang 3 兩位、8/27 Snail 2 兩位),
           所以不擋「跟其他技師同隊」,只擋「落單」—— 8/19 Pharos 3 三位 TSWA 那天,
           備註就寫著 PTW: add Marek Marciniak,正是補成四位。 */
    const memLv = mem.filter(m => m.person).map(m => m.person.level.toUpperCase());
    const tswaN = memLv.filter(isBladeLevel).length;
    const blade = isBladeTeam(t.worktype, memLv);
    if (tswaN % 2 === 1) {
      const who = mem.filter(m => m.person && isBladeLevel(m.person.level)).map(m => m.person.name);
      const spare = roster.people.filter(p => isBladeLevel(p.level) &&
                      avail.get(p.name).ok && !scheduled.has(p.name));
      add("stop","tswa_odd",
          `${t.name} 有 ${tswaN} 位 TSWA(${who.join("、")}),TSWA 要成雙(偶數)`,
          spare.length ? "今天還可以補:" + spare.map(p=>p.name).join("、")
                       : "今天沒有其他可用的 TSWA,要拿掉一位,或從別隊調一位過來湊成雙", t.name);
      badTeams.add(t.name);
    }
    if (blade) continue;                            // 葉片組沒有隊長編制,人數也是成雙算,下面的規則不套用

    if (n > 0 && n < minTeam) {
      const pool = roster.people.filter(p => avail.get(p.name).ok && !scheduled.has(p.name)
                                          && !isBladeLevel(p.level));   // TSWA 不補別隊
      add("warn","team_size", `${t.name} 只有 ${n} 人,低於 ${minTeam} 人下限`,
          pool.length ? "可補:" + pool.slice(0,5).map(p=>p.name).join("、") : "今天沒有可補的人", t.name);
      badTeams.add(t.name);
    }
    if ((t.worktype||"").toUpperCase() === "AS" && n > 0 && n < (S.as_acceptable ?? 4)) {
      add("warn","as_size", `${t.name} 年保隊只有 ${n} 人`,
          `年保理想 ${S.as_ideal ?? 6} 人,4～5 人算正常,低於 4 才要補`, t.name);
      badTeams.add(t.name);
    }

    const lvls = new Set(mem.filter(m=>m.person).map(m=>m.person.level.toUpperCase()));
    if (lvls.size && [...lvls].every(l => R.LEADER_EXEMPT.includes(l))) continue;

    // 有歐洲技師(Level = HV)才是「HV 嚴重問題」的隊,規則才收緊
    const hasEuro = isHV && mem.some(m => m.person &&
                    m.person.level.toUpperCase() === R.EURO_LEVEL);
    /* mem 已排除岸上支援職(ST)。這裡再跳過歐洲技師(HV):
       他常被寫在名單第一位,但依 Tina 的說法他是專業支援,隊長仍是 TSF / MTF。
       不跳過的話,Nick Bond 這種人排第一位就會被誤判成「階級太低不能帶隊」。 */
    const lead = mem.find(m => m.person &&
      m.person.level.toUpperCase() !== R.EURO_LEVEL &&      // 歐洲技師是專業支援,不是隊長
      !R.SUPPORT.includes(m.person.level.toUpperCase()));   // 岸上職務也不當隊長
    if (lead) {
      const lv = lead.person.level.toUpperCase();
      const ok = hasEuro ? R.HV_LEADER.includes(lv) : roster.canLead(lead.person);
      if (!ok) {
        const cand = mem.filter(m => m.person && (hasEuro
              ? R.HV_LEADER.includes(m.person.level.toUpperCase()) : roster.canLead(m.person)))
          .map(m => m.person.name);
        add(hasEuro ? "warn" : "stop", hasEuro ? "hv_leader" : "leader",
          hasEuro
            ? `${t.name} 有歐洲技師(HV),隊長 ${lead.person.name}(${lead.person.level})不是 TSF / MTF`
            : `${t.name} 名單第一位是 ${lead.person.name}(${lead.person.level}),` +
              `不是隊長級 —— CT、BT 只能當隊員`,
          cand.length ? "隊上可接隊長:" + cand.join("、")
            : (hasEuro ? "這一隊要從外面補一位 TSF 或 MTF 當隊長"
                       : "這一隊沒有 TS/TSF/MT/MTF,要從外面補一位"), t.name);
        badTeams.add(t.name);
      }
    }
    // 歐洲技師 + TSF/MTF 隊長 + 一個 CT 或 BT,三個一組才成隊
    if (hasEuro && !mem.some(m => m.person && R.HV_ASSIST.includes(m.person.level.toUpperCase()))) {
      const cand = roster.people.filter(p => R.HV_ASSIST.includes(p.level.toUpperCase())
                     && avail.get(p.name).ok && !scheduled.has(p.name));
      add("warn","hv_assist", `${t.name} 有歐洲技師(HV),但隊裡沒有 CT 或 BT`,
          cand.length ? "今天可搭配:" + cand.slice(0,5).map(p=>p.name).join("、")
                      : "今天沒有可用的 CT / BT", t.name);
      badTeams.add(t.name);
    }
  }

  /* ---- TSWA 整組規則 ----
     [U] 正常 8 位、分兩隊、同進同出。所以:
       · 今天可出海的 TSWA 有人沒被排到 → 提醒(整組行動,不該有人留在岸上,除非是奇數湊不成雙)
       · 有 TSWA 的隊伍分在不同船或不同班 → 提醒(同進同出) */
  {
    const tswaAvail = roster.people.filter(p => isBladeLevel(p.level) &&
      avail.get(p.name).ok && avail.get(p.name).cat === "available");
    const out = tswaAvail.filter(p => !scheduled.has(p.name)).map(p => p.name);
    if (z.zone === "plan" && out.length) {
      const odd = tswaAvail.length % 2 === 1;
      add("warn","tswa_left",
          `TSWA 是整組行動的:今天 ${tswaAvail.length} 位可出海,有 ${out.length} 位沒排到:` + out.join("、"),
          odd ? "今天 TSWA 是奇數,一定會有一位湊不成雙,確認留下的是不是這一位"
              : "正常是 8 位分兩隊同進同出,確認是不是漏排");
    }
    const spots = new Set(teams.filter(t => crew(t).some(m => m.person && isBladeLevel(m.person.level)))
                               .map(t => t.vessel + (t.night ? "(夜)" : "")));
    if (spots.size > 1)
      add("warn","tswa_split", `TSWA 分在不同的船或班:` + [...spots].join("、"),
          "TSWA 兩隊是同進同出的,通常一起搭 World Sea");
  }

  for (const [k,used] of seats) {
    const [vessel, nightStr] = k.split("|");
    const night = nightStr === "true";
    if (used > cap) {
      const hasPainter = teams.some(t => t.painter && t.vessel===vessel && t.night===night && seatsOf(t)>0);
      add("stop","capacity",
        `${vessel} ${night?"夜班":"白天班"} 共 ${used} 人,超過 ${cap} 席` +
        (hasPainter ? `(Snail 3 有人,已含 ${R.PAINTER_SEATS} 席 painter)` : ""),
        "建議移出非隊長、非綁定、加班意願低的人", vessel);
      teams.filter(t => t.vessel===vessel && t.night===night).forEach(t => badTeams.add(t.name));
    }
  }

  for (const [name, ts] of scheduled) {
    const a = avail.get(name);
    if (ts.length > 1) {
      add("stop","duplicate", `${name} 同一天被排在 ${ts.length} 隊:${ts.join("、")}`,
          "保留有隊長身分或缺口較大的那一隊", ts[0]);
      ts.forEach(x => badTeams.add(x));
    }
    if (!a.ok && a.cat !== "blank" && a.cat !== "onshore") {
      const lvl = (roster.byName.get(name)||{}).level;
      const same = roster.people.filter(p => p.level===lvl && avail.get(p.name).ok && !scheduled.has(p.name));
      add("stop","unavailable", `${name} 被排了,但總表當天是「${a.why}」`,
          same.length ? "同等級可替補:" + same.slice(0,5).map(p=>p.name).join("、")
                      : "同等級今天沒有可替補的人", ts[0]);
      badTeams.add(ts[0]);
    }
  }

  for (const t of teams) {
    if (t.painter) continue;
    const names = new Set(crew(t).filter(m=>m.person).map(m=>m.person.name));
    for (const [a,b] of (S.avoid_pairs||[])) if (names.has(a) && names.has(b)) {
      add("warn","avoid", `${t.name} 裡同時有 ${a} 和 ${b},他們設定成不同隊`, "把其中一位換到別隊", t.name);
      badTeams.add(t.name);
    }
    for (const [a,b] of (S.bind_pairs||[])) if (names.has(a) !== names.has(b)) {
      const inT = names.has(a) ? a : b, out = names.has(a) ? b : a;
      if (scheduled.has(out))
        add("warn","bind", `${inT} 和 ${out} 設定成同隊,但 ${out} 被排在 ${scheduled.get(out).join("、")}`,
            `把 ${out} 換到 ${t.name}`, t.name);
    }
  }

  if (z.zone === "plan") {
    const missing = roster.people
      .filter(p => avail.get(p.name).ok && avail.get(p.name).cat === "available" && !scheduled.has(p.name))
      .map(p => p.name);
    if (missing.length)
      add("warn","not_scheduled",
        `總表說可以出海、但沒有被排到的人有 ${missing.length} 位:` + missing.slice(0,12).join("、"),
        "確認是漏排,還是刻意留作備援");
  }

  const unknown = [...new Set(teams.flatMap(t =>
    t.members.filter(m => !m.person && !m.outsider).map(m => m.display)))].sort();
  if (unknown.length)
    add("warn","unknown_name", `有 ${unknown.length} 個名字在總表裡找不到:` + unknown.slice(0,10).join("、"),
        "這些多半是外包或臨時支援,可以在設定的排除名單裡處理");

  if (hiddenHits.length)
    add("info","hidden", `有 ${hiddenHits.length} 位在總表裡是隱藏的,不列入人數:` +
        hiddenHits.slice(0,6).join("、"),
        "隱藏代表資料留著但不再排班,所以這些人不算進核對");
  if (awayHits.length)
    add("warn","away", `有 ${awayHits.length} 位當天不是為雲林工作,卻出現在班表:` +
        awayHits.slice(0,6).join("、"),
        "這幾位不算進人數核對,確認是不是要拿掉");

  if (z.zone === "weather_off")
    issues.unshift({ level:"info", kind:"weather",
      msg:`這一天總表全員留在岸上(${z.on} 人)、沒有人標 OF,判定為天氣取消`,
      fix:"班表本來就會先排人,取消時只畫刪除線或註記 WOW,所以不做人數比對", where:"" });

  const total = teams.filter(t => !t.painter).reduce((s,t) => s + crew(t).length, 0);
  const should = roster.people.filter(p => {
    const a = avail.get(p.name);
    if (a.cat === "support") return scheduled.has(p.name);   // 岸上職務:排到了才算基準
    return a.ok && (a.cat === "available" || a.cat === "offshore");
  }).length;

  return {
    date: day, zone: z.zone, avail, scheduled, badTeams,
    summary: { teams: teams.filter(t => seatsOf(t)).length, scheduled: total, should,
               diff: total - should, of:z.of, on:z.on,
               stop: issues.filter(i=>i.level==="stop").length,
               warn: issues.filter(i=>i.level==="warn").length },
    issues,
    unschedulable: groupUnschedulable(roster, avail),
  };
}

function groupUnschedulable(roster, avail) {
  const groups = new Map();
  for (const p of roster.people) {
    const a = avail.get(p.name);
    if (a.ok || a.cat === "shore") continue;
    if (!groups.has(a.why)) groups.set(a.why, []);
    groups.get(a.why).push({ name:p.name, level:p.level, group:p.group });
  }
  return [...groups.entries()]
    .map(([why,people]) => ({ why, people, minor: why === R.BLANK[1] }))
    .sort((a,b) => (a.minor - b.minor) || (b.people.length - a.people.length));
}

/* ---------------------------------------------------------------- 草稿 */
/* 有沒有「可以拿來當範本」的班表 —— 檔案裡有的日子算,畫面上做好的草稿也算。
   [U] Tina 要在 9/15 排完之後,讓 9/16 直接參考 9/15,
       但出海計畫只寫到 9/14,所以基準日不能只認檔案裡的日期。 */
const hasCrew = (plan, d) =>
  (plan.days.has(d) && plan.days.get(d).teams.some(t => t.members.length)) ||
  (DRAFTS.has(d) && DRAFTS.get(d).teams.some(t => t.slots.some(s => s.name || s.fixed)));

/* 把「基準日」正規化成一份隊伍清單,不管它來自檔案還是來自草稿 */
function baseTeams(plan, roster, base, preferFile) {
  /* 同一天檔案裡有、畫面上也有草稿時,以草稿為準 —— 那是使用者最後改過的版本。
     只有「拿這一天自己當起頭」(preferFile)時才照檔案,不然一鍵產生會拿自己的草稿重排自己。 */
  const d = DRAFTS.get(base);
  if ((!d || preferFile) && plan.days.has(base)) { linkNames(plan, roster, base); return plan.days.get(base).teams; }
  if (!d) return null;
  return d.teams.map(t => ({
    name:t.name, vessel:t.vessel, worktype:t.worktype, night:t.night, painter:t.painter,
    members: t.slots.filter(s => s.name || s.fixed).map(s => s.fixed
      ? { display:s.fixed, person:null, struck:false, level:"" }
      : { display:s.name, person: roster.byName.get(s.name) || null, struck:false, level:"" }),
  }));
}

/* 草稿也可以當基準日,但寫回 Excel 時一定要有一個「檔案裡真的存在」的區塊當版面。
   所以順著 草稿→它的基準日 一路往回走,走到檔案裡有的那一天為止。 */
function layoutDay(plan, base) {
  let b = base;
  for (let i = 0; b && i < 40; i++) {
    if (plan.days.has(b)) return plan.days.get(b);
    b = (DRAFTS.get(b) || {}).base;
  }
  return null;
}

function baselineDate(plan, target) {
  // 同梯次優先:每 14 天往前找,最多回推一年 —— 出海計畫沒寫到的遠期日子也對得到
  for (let k = 1; k <= 26; k++) {
    const c = addDays(target, -R.ROTATION_DAYS * k);
    if (hasCrew(plan, c)) return c;
  }
  // 真的找不到同梯次,就退而求其次抓最近有排班的一天
  for (let b = 1; b <= 120; b++) {
    const c = addDays(target, -b);
    if (hasCrew(plan, c)) return c;
  }
  return null;
}

/* 上一輪班表從頭到尾沒被排到、這一輪可以出海的人 —— Jimmy Hsu 的成因。
   刻意看「班表有沒有出現過」而不是總表代碼:歷史區寫的是 OF/ON,
   拿它判斷會把整批留守的人都誤判成新回來的(實測 4 人 vs 31 人)。 */
function returningPeople(plan, roster, base, target) {
  const seen = new Set();
  for (let i = 0; i < 7; i++) {
    const d = addDays(base, i);
    const ts = baseTeams(plan, roster, d);        // 檔案裡的或畫面上的草稿都算
    if (!ts) continue;
    for (const t of ts)
      for (const m of t.members) if (m.person) seen.add(m.person.name);
  }
  return roster.people
    .filter(p => roster.isOffshore(p) && !seen.has(p.name) && roster.avail(p,target).cat === "available")
    .map(p => ({ name:p.name, level:p.level }));
}

/* 這一天該寫在 Leave/Training 欄的人。
   [U] 2026-09-19 Tina:產出的 9/22 把 9/08 的請假名單原封不動抄下來,那些人 9/22 早就回來上班了。
   [V] 對過 9/14~9/21 檔案裡的 Leave/Training 欄 vs 總表:就是當天代碼 L / T 的出海技師,
       不含岸上職務(ST、SM),也不含長期都是 L 的人(Andre Fernandes 天天 L,AOC 從來不列他)。 */
function leaveList(roster, target) {
  const isLT = c => { const u = (c || "").trim().toUpperCase(); return u === "L" || u === "T"; };
  const isWork = c => { const u = (c || "").trim().toUpperCase();
    return u === "W" || u === "OF" || u === "ON" || R.OFFSHORE.includes(u); };
  return roster.people.filter(p => {
    if (!roster.isOffshore(p) || !isLT(roster.code(p, target))) return false;
    // 前 14 天要有上過班的紀錄才算「這一輪請假」;一路 L / fly / 空白的是長假,AOC 不列
    for (let i = 1; i <= 14; i++) if (isWork(roster.code(p, addDays(target, -i)))) return true;
    return false;
  });
}

/* 出海計畫裡這一天已經排了人嗎(只看檔案,不看畫面上的草稿) */
const fileHasCrew = (plan, d) =>
  plan.days.has(d) && plan.days.get(d).teams.some(t => t.members.some(m => !m.struck));

function buildDraft(plan, roster, target, S, base) {
  /* [U] 2026-09-12 Tina:9/15 在檔案裡已經排好了,一鍵產生卻照 9/01 重排一遍。
     檔案裡已經有的日子,草稿要以「那一天自己的內容」起頭 ——
     只把當天不能出海的人挖掉、缺的補上,不要拿上一輪蓋掉 AOC 已經排好的東西。
     使用者手動指定基準日時還是照指定的。 */
  const fromFile = !base && fileHasCrew(plan, target);
  base = base || (fromFile ? target : baselineDate(plan, target));
  if (!base) return { error:"往前找不到可以當基準的日子,請手動指定" };
  const bteams = baseTeams(plan, roster, base, base === target);
  if (!bteams) return { error:`基準日 ${base} 既不在出海計畫裡,也還沒有草稿` };
  /* 總表在「今天」前後是兩套代碼:之前寫 OF/ON(已發生的事實),之後才寫等級。
     對已經過去的日子產生草稿,可用人力池會是空的,補人一定失敗、整份草稿都是空缺,
     所以直接講清楚,不要讓人以為工具壞了。 */
  const z = roster.zone(target).zone;
  const isNew = !plan.days.has(target);
  const zoneNote = z === "plan"
    ? (isNew ? `出海計畫還沒有 ${target} 這一天,這份草稿是照基準日 ${base} 的隊伍結構開出來的。`
             + `　確認後要自己在 Excel 新增這一天的區塊,再把各隊貼進去。` : "")
    : (z === "weather_off"
        ? "這一天總表全員留在岸上(天氣取消),草稿只能當參考。"
        : "這一天總表已經是事後紀錄(OF / ON),不是未來計畫 —— 草稿補不了人,請改選今天或之後的日期。");
  const excluded = new Set((S.exclude||[]).map(x => x.toLowerCase()));
  const used = new Set();
  const teams = [];

  const tswaToday = roster.people.some(p => isBladeLevel(p.level) && roster.avail(p, target).cat === "available");
  for (const t of bteams) {
    // 空的隊伍不帶進草稿 —— 但葉片組例外:今天有 TSWA 可出海,就要把 Snail 1 / Snail 2 留著給他們
    if (!t.members.length && !(tswaToday && isBladeTeam(t.worktype, []))) continue;
    const slots = [];
    for (const m of t.members) {
      if (m.struck) continue;
      if (isOutsider(m.display) || t.painter) { slots.push({ fixed:m.display }); continue; }
      if (!m.person) { slots.push({ name:"", why:`原本是 ${m.display},對不上總表`, kind:"gap" }); continue; }
      const a = roster.avail(m.person, target);
      if (excluded.has(m.person.name.toLowerCase()))
        slots.push({ name:"", why:`原本是 ${m.person.name},設定裡排除`, kind:"gap" });
      else if (a.ok) { slots.push({ name:m.person.name, why: fromFile ? "檔案裡已排" : "沿用基準日", kind:"kept" });
                       used.add(m.person.name); }
      else slots.push({ name:"", why:`原本是 ${m.person.name},${a.why}`, kind:"gap" });
    }
    teams.push({ name:t.name, vessel:t.vessel, worktype:t.worktype, night:t.night,
                 painter:t.painter, slots });
  }
  const tswaLeft = autoFill(teams, roster, target, S, used);
  return { target, base, teams, zoneNote, fromFile, tswaLeft,
           leave: leaveList(roster, target).map(p => p.name),
           // 以檔案自己的內容起頭時,「上一輪漏掉誰」這個問題不成立,漏排的人由檢核的差額去講
           returning: fromFile ? [] : returningPeople(plan, roster, base, target) };
}

function autoFill(teams, roster, target, S, used) {
  const excluded = new Set((S.exclude||[]).map(x => x.toLowerCase()));
  const order = S.leader_order || [], ot = S.overtime || {};
  const avoid = new Set((S.avoid_pairs||[]).map(p => [...p].sort().join(" ")));
  const pool = roster.people.filter(p =>          // cat "support" 不自動補,要由人自己挑
    roster.avail(p,target).cat === "available" && !excluded.has(p.name.toLowerCase()));
  const rank = p => [order.indexOf(p.name) < 0 ? 999 : order.indexOf(p.name),
                     ({yes:0,maybe:1,no:2})[ot[p.name]] ?? 1, p.name];
  const sorted = [...pool].sort((a,b) => {
    const x = rank(a), y = rank(b);
    return x[0]-y[0] || x[1]-y[1] || (x[2] < y[2] ? -1 : 1);
  });

  for (const team of teams) {
    if (team.painter) continue;                    // [T] Snail 3 / Paint 完全不套用規則
    const isHV = (team.worktype||"").toUpperCase() === "HV";
    const lv = n => { const p = n && roster.byName.get(n); return p ? p.level.toUpperCase() : ""; };
    const names = () => new Set(team.slots.filter(s => s.name).map(s => s.name));
    const okAvoid = (name, cur) =>
      ![...cur].some(n => avoid.has([name, n].sort().join(" ")));
    /* [U] TSWA 只進葉片組、葉片組只收 TSWA —— 補人前先過這一關 */
    const blade = isBladeTeam(team.worktype, team.slots.filter(s => s.name).map(s => lv(s.name)));
    const fitTeam = p => isBladeLevel(p.level) === blade;

    /* 填進一個空缺 */
    const take = (pred, why) => {
      const cur = names();
      for (const p of sorted) {
        if (used.has(p.name) || !fitTeam(p) || !pred(p) || !okAvoid(p.name, cur)) continue;
        const slot = team.slots.find(s => s.kind === "gap" && !s.name);
        if (!slot) return null;
        slot.name = p.name; slot.why = why; slot.kind = "auto";
        used.add(p.name);
        return p;
      }
      return null;
    };
    /* 沒有空缺可用時,換掉最後面那一位隊員 */
    const swapIn = (pred, why) => {
      const cur = names();
      const cand = sorted.find(p => !used.has(p.name) && fitTeam(p) && pred(p) && okAvoid(p.name, cur));
      if (!cand) return null;
      let i = team.slots.length - 1;
      while (i > 0 && (team.slots[i].fixed || !team.slots[i].name)) i--;
      if (i <= 0) return null;
      const outName = team.slots[i].name;
      if (outName) used.delete(outName);
      team.slots[i] = { name: cand.name, kind: "auto",
                        why: outName ? `換掉 ${outName},${why}` : why };
      used.add(cand.name);
      return cand;
    };
    /* 先填空缺,填不到再換人 */
    const ensure = (pred, why) => take(pred, why) || swapIn(pred, why);

    const hasGap = () => team.slots.some(s => s.kind === "gap" && !s.name);

    if (blade) {
      /* 葉片組:只補 TSWA、沒有隊長編制。兩隊怎麼分、成不成雙,由後面的「TSWA 整組平衡」統一處理 */
      while (hasGap()) if (!take(() => true, "補足人數(TSWA)")) break;
      continue;
    }

    if (hasGap()) {
      for (const [a,b] of (S.bind_pairs||[])) {
        const cur = names();
        if (cur.has(a) && !cur.has(b)) take(p => p.name === b, `與 ${a} 綁定`);
        else if (cur.has(b) && !cur.has(a)) take(p => p.name === a, `與 ${b} 綁定`);
      }
    }

    const hasEuro = isHV && team.slots.some(s => lv(s.name) === R.EURO_LEVEL);
    const leaderOk = p => hasEuro ? R.HV_LEADER.includes(p.level.toUpperCase())
                                  : roster.canLead(p);

    /* [T] 2026-09-08 Tina 確認:一定要有 TS 或 MT 帶隊,不分主力隊或承攬商隊。
       所以隊上沒有隊長級時,沒有空缺也要換一個人進來,不要留給人工去發現。 */
    if (!team.slots.some(s => { const p = s.name && roster.byName.get(s.name);
                                return p && leaderOk(p); }))
      ensure(leaderOk, hasEuro ? "補 HV 隊長(TSF / MTF)" : "隊上要有隊長");

    // 有歐洲技師就一定要搭一個 CT 或 BT
    if (hasEuro && !team.slots.some(s => R.HV_ASSIST.includes(lv(s.name))))
      ensure(p => R.HV_ASSIST.includes(p.level.toUpperCase()), "HV 隊要搭 CT / BT");

    while (hasGap()) if (!take(() => true, "補足人數")) break;

    /* 隊長排在名單第一位 —— 檢核是看第一個人,現場也是這樣讀 */
    const idx = team.slots.findIndex(s => {
      const p = s.name && roster.byName.get(s.name);
      return p && leaderOk(p);
    });
    const first = team.slots[0] && team.slots[0].name && roster.byName.get(team.slots[0].name);
    if (idx > 0 && (!first || !leaderOk(first))) {
      const t0 = team.slots[0];
      team.slots[0] = team.slots[idx];
      team.slots[idx] = t0;
      team.slots[0].why = (team.slots[0].why || "") + "・調到隊長位";
    }
  }

  /* ---- TSWA 整組平衡 ----
     [U] 2026-09-12 Tina:TSWA 正常 8 位,分兩隊、同進同出,每隊固定偶數,是很特別的隊伍。
     所以不是一隊一隊各補各的,而是把「今天可出海的 TSWA」整組拿來,兩隊平分、每隊都成雙:
       8 → 4+4、6 → 4+2、4 → 2+2、2 → 2+0;奇數就有一位排不進去,留在畫面上讓人決定。
     原本就在葉片組的人盡量留在原隊,只挪多出來或補進來的人。
     落單在別隊的 TSWA(那一隊只有他一個)一律收回來 —— 那多半是換班日的寫法,不是刻意的;
     兩兩一組跟著 TS/MT 出海的(偶數)就不動。 */
  const lvOf = n => { const p = n && roster.byName.get(n); return p ? p.level.toUpperCase() : ""; };
  const isTswaSlot = x => x.name && isBladeLevel(lvOf(x.name));
  let bladeTeams = teams.filter(t => !t.painter && isBladeTeam(t.worktype, []));   // 先認工作類型 Fan / Blade
  if (!bladeTeams.length)
    bladeTeams = teams.filter(t => !t.painter &&
      isBladeTeam(t.worktype, t.slots.filter(x => x.name).map(x => lvOf(x.name))));
  const tswaLeft = [];
  if (bladeTeams.length >= 2) {
    const keptBy = bladeTeams.map(t => t.slots.filter(x => isTswaSlot(x) && x.kind === "kept"));
    const extras = [];
    for (const t of bladeTeams)
      for (const x of t.slots) if (isTswaSlot(x) && x.kind !== "kept") extras.push(x);
    for (const t of teams) {                       // 別隊落單的 TSWA 收回來
      if (bladeTeams.includes(t) || t.painter) continue;
      const mine = t.slots.filter(isTswaSlot);
      if (mine.length % 2 === 1) {
        for (const x of mine) { extras.push({ name:x.name, kind:"auto", why:`從 ${t.name} 收回葉片組` });
                                x.name = ""; x.kind = "gap"; x.why = "TSWA 收回葉片組"; }
      }
    }
    for (const p of sorted)
      if (isBladeLevel(p.level) && !used.has(p.name)) {
        extras.push({ name:p.name, kind:"auto", why:"葉片組整組出海" }); used.add(p.name);
      }
    const T = keptBy.reduce((n,k) => n + k.length, 0) + extras.length;
    const usable = T - (T % 2), half = usable / 2;
    const sizes = [half % 2 === 0 ? half : half + 1, half % 2 === 0 ? half : half - 1];
    // 每隊先留自己原本的人,超出的擠到 extras 前面(優先分給另一隊)
    const plan2 = bladeTeams.map((t, k) => {
      const want = k < 2 ? sizes[k] : 0;
      const keep = keptBy[k].slice(0, want);
      extras.unshift(...keptBy[k].slice(want));
      return { t, want, keep };
    });
    for (const pl of plan2)
      while (pl.keep.length < pl.want && extras.length) pl.keep.push(extras.shift());
    for (const pl of plan2) {
      const others = pl.t.slots.filter(x => x.fixed || (x.name && !isBladeLevel(lvOf(x.name))));
      pl.t.slots = others.concat(pl.keep.map(x => ({ name:x.name, kind:x.kind, why:x.why })));
    }
    for (const x of extras) { used.delete(x.name); tswaLeft.push(x.name); }   // 奇數多出來的那一位
  }

  /* ---- 借調 ----
     [T] Tina 確認每一隊都要有 TS 或 MT 帶隊,所以上面補不到人時不能就這樣算了。
     實測 9/20 有一隊掛了三個隊長級,另外兩隊一個都沒有 —— 這種就是調過去而不是加班。
     做法是「對調」:把多的隊長換過去,把那邊的隊員換回來,兩隊人數都不變。 */
  const byName = n => (n && roster.byName.get(n)) || null;
  const leaderTest = t => {
    const isHV = (t.worktype||"").toUpperCase() === "HV";
    const hasEuro = isHV && t.slots.some(s => {
      const p = byName(s.name); return p && p.level.toUpperCase() === R.EURO_LEVEL; });
    return p => hasEuro ? R.HV_LEADER.includes(p.level.toUpperCase()) : roster.canLead(p);
  };
  const teamNames = t => new Set(t.slots.filter(s => s.name).map(s => s.name));
  const fits = (name, t) => ![...teamNames(t)]
    .some(n => n !== name && avoid.has([name, n].sort().join(" ")));
  const bladeT = t => isBladeTeam(t.worktype,
    t.slots.filter(s => s.name).map(s => (byName(s.name)||{level:""}).level));

  for (const need of teams) {
    if (need.painter || bladeT(need) || !need.slots.some(s => s.name)) continue;   // 葉片組不需要隊長
    const okN = leaderTest(need);
    if (need.slots.some(s => { const p = byName(s.name); return p && okN(p); })) continue;

    let done = false;
    for (const donor of teams) {
      if (done || donor === need || donor.painter || bladeT(donor)) continue;
      const okD = leaderTest(donor);
      const leads = donor.slots.filter(s => { const p = byName(s.name); return p && okD(p); });
      if (leads.length < 2) continue;                       // 只有一個就不能借

      for (const give of leads.slice(1)) {
        const gp = byName(give.name);
        if (!gp || !okN(gp) || !fits(gp.name, need)) continue;
        const gap = need.slots.find(s => !s.name && !s.fixed);
        if (gap) {                                           // 那邊有空缺,直接補過去
          gap.name = gp.name; gap.kind = "auto";
          gap.why = `從 ${donor.name} 借調過來當隊長`;
          give.name = ""; give.kind = "gap"; give.why = `借給 ${need.name} 當隊長`;
          // 借出的那一隊缺一個人,從還沒排到的人裡面補回來
          const back = sorted.find(q => !used.has(q.name) && !isBladeLevel(q.level) && fits(q.name, donor));
          if (back) { give.name = back.name; give.kind = "auto";
                      give.why = `補上借給 ${need.name} 的缺`; used.add(back.name); }
        } else {                                             // 沒空缺就對調,兩隊人數不變
          let i = need.slots.length - 1;
          while (i > 0 && (need.slots[i].fixed || !need.slots[i].name)) i--;
          if (i <= 0) continue;
          const back = need.slots[i].name;
          if (!fits(back, donor)) continue;
          need.slots[i] = { name: gp.name, kind:"auto",
                            why: `從 ${donor.name} 借調過來當隊長(${back} 換過去)` };
          give.name = back; give.kind = "auto"; give.why = `與 ${need.name} 對調`;
        }
        // 借來的隊長排到第一位
        const k = need.slots.findIndex(s => s.name === gp.name);
        if (k > 0) { const t0 = need.slots[0]; need.slots[0] = need.slots[k]; need.slots[k] = t0; }
        done = true;
        break;
      }
    }
  }
  return tswaLeft;
}

/* ================================================================= 介面 */
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e = document.createElement(t); if (c) e.className = c;
  if (h !== undefined) e.innerHTML = h; return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const IN_ARTIFACT = typeof window !== "undefined" && !!window.claude;

let ROSTER=null, PLAN=null, DAY=null, S={...DEFAULTS}, CAND=null;
let ROSTER_INFO={}, PLAN_INFO={}, DRAFT=null, LAST=null, NOTES=[];
let dateCombo=null, baseCombo=null, ALLDATES=[], PRE=null;
/* [U] 做好的草稿要留著:切到別的日期再切回來,原本改好的內容不能不見。
   一份草稿 = 一天,鍵就是日期。整個工具只有這一個草稿倉庫,
   「下兩輪」那一頁和「排班」那一頁看的是同一份資料,所以在哪邊改都一致。 */
const DRAFTS = new Map();

const SKEY = "yunlin-settings-v1", NKEY = "yunlin-notes-v1";
function loadLocal(){
  try { const r = localStorage.getItem(SKEY); if (r) S = { ...DEFAULTS, ...JSON.parse(r) }; } catch(_) {}
  try { const r = localStorage.getItem(NKEY); if (r) NOTES = JSON.parse(r) || []; } catch(_) {}
}
