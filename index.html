/* ---------- 搜尋式下拉 ---------- */
function combo(cfg) {
  const box = el("div","cb");
  if (cfg.width) box.style.width = cfg.width;
  const inp = el("input");
  inp.placeholder = cfg.placeholder || "輸入以搜尋…";
  inp.value = cfg.value || "";
  inp.autocomplete = "off";
  box.append(inp, el("span","arrow","▼"));
  box._label = cfg.value || "";
  let list = null, cur = -1, shown = [], showAll = false;

  const close = () => { if (list) { list.remove(); list = null; cur = -1; } };
  const render = () => {
    // 剛點進來時先列出全部,不要拿目前已選的名字去篩 —— 否則永遠只看得到自己
    const q = showAll ? "" : clean(inp.value);
    const rows = [];
    for (const o of cfg.options()) {
      if (o.head) { rows.push(o); continue; }
      const hay = clean(o.label + " " + (o.lv||"") + " " + (o.sub||""));
      if (!q || hay.includes(q)) rows.push(o);
    }
    // 丟掉底下已經沒有項目的標題
    const kept = rows.filter((o,i) => {
      if (!o.head) return true;
      for (let j = i+1; j < rows.length; j++) { if (rows[j].head) break; return true; }
      return false;
    });
    shown = kept.filter(o => !o.head);
    close();
    list = el("div","list");
    if (!shown.length) list.append(el("div","none","找不到符合的人"));
    kept.forEach(o => {
      if (o.head) { list.append(el("div","hd", esc(o.label))); return; }
      const d = el("div","opt",
        `<span>${esc(o.label)}</span>` +
        (o.lv ? `<span class="lv">${esc(o.lv)}</span>` : "") +
        (o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ""));
      d.dataset.v = o.value;
      d.onmousedown = e => { e.preventDefault(); pick(o); };
      list.append(d);
    });
    box.append(list);
  };
  const pick = o => { box._label = o.label; inp.value = o.label; close(); cfg.onChange(o.value, o); };
  const move = n => {
    if (!list) return;
    const opts = [...list.querySelectorAll(".opt")];
    if (!opts.length) return;
    cur = Math.max(0, Math.min(opts.length-1, cur + n));
    opts.forEach(o => o.classList.remove("cur"));
    opts[cur].classList.add("cur");
    opts[cur].scrollIntoView({ block:"nearest" });
  };
  inp.onfocus = () => { showAll = true; inp.select(); render(); };
  inp.oninput = () => { showAll = false; cur = -1; render(); };
  inp.onkeydown = e => {
    if (e.key === "ArrowDown") { e.preventDefault(); if (!list) render(); move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const opts = list ? [...list.querySelectorAll(".opt")] : [];
      if (cur >= 0 && opts[cur]) { const o = shown.find(x => String(x.value) === opts[cur].dataset.v);
        if (o) pick(o); }
      else if (shown.length === 1) pick(shown[0]);
    } else if (e.key === "Escape") { close(); inp.blur(); }
  };
  inp.onblur = () => setTimeout(() => {
    close();
    const typed = inp.value.trim();
    if (!typed && cfg.allowEmpty && box._label) { box._label = ""; cfg.onChange("", null); }
    else inp.value = box._label;                 // 沒選就還原,不留半截字
  }, 130);
  box.setValue = label => { box._label = label || ""; inp.value = label || ""; };
  return box;
}

/* ---------- 開檔 ---------- */
const prog = m => $("#prog").textContent = m;

async function handleFiles(files) {
  const picked = [...files].filter(f => f.name.toLowerCase().endsWith(".xlsx") && !f.name.startsWith("~$"));
  if (!picked.length) { prog("請選 .xlsx 檔案。"); return; }
  if (!("DecompressionStream" in window)) {
    $("#startwarn").classList.remove("hide");
    $("#startwarn").textContent = "這個瀏覽器太舊,無法解開 Excel 檔。請用 Edge 或 Chrome 開啟。";
    return;
  }
  try {
    for (const f of picked) {
      prog(`開啟 ${f.name}…`);
      const book = await Book.open(f, prog);
      const isPlan = book.sheetNames.some(n => n.toLowerCase().includes("daily ops"));
      const isRoster = book.sheetNames.some(n => /^allowance/i.test(n));
      if (!isPlan && !isRoster) { prog(`${f.name} 看起來不是這兩份檔案,略過。`); continue; }
      await book.prepare(prog);
      if (isPlan) {
        PLAN = await Plan.build(book, prog);
        PLAN_INFO = { file:f.name, sheet:PLAN.sheetName };
        $("#d2").classList.add("on");
        $("#n2").textContent = `每日出海計畫　${f.name} · ${PLAN.sheetName} · ${PLAN.dates.length} 天`;
      } else {
        ROSTER = await Roster.build(book, prog);
        ROSTER_INFO = { file:f.name, sheet:ROSTER.sheetName };
        $("#d1").classList.add("on");
        $("#n1").textContent = `人力總表　${f.name} · ${ROSTER.sheetName} · ${ROSTER.people.length} 人`;
      }
    }
  } catch (e) {
    prog("");
    $("#startwarn").classList.remove("hide");
    $("#startwarn").textContent = "讀取失敗:" + e.message;
    return;
  }
  if (ROSTER && PLAN) { prog("讀好了,正在開啟…"); setTimeout(startApp, 60); }
  else prog("還缺一個檔案,再把另一個拖進來就好。");
}

function startApp() {
  $("#start").classList.add("hide");
  $("#app").classList.remove("hide");
  $("#files").innerHTML =
    `<b>${esc(ROSTER_INFO.file)}</b> · ${esc(ROSTER_INFO.sheet)} · ${ROSTER.people.length} 人` +
    (ROSTER.hiddenPeople.length ? `(另有 ${ROSTER.hiddenPeople.length} 位隱藏,已排除)` : "") +
    `　　<b>${esc(PLAN_INFO.file)}</b> · ${esc(PLAN_INFO.sheet)} · ${PLAN.dates.length} 天 ` +
    `(${PLAN.dates[0]} ~ ${PLAN.dates[PLAN.dates.length-1]})`;
  /* 出海計畫寫到 2026-09-14,但總表的日期欄一路到 2027-01-28。
     只列計畫有的日子,就永遠排不了「還沒建立的那一天」—— 而那才是最常要排的。 */
  const lastPlan = PLAN.dates[PLAN.dates.length-1];
  const extra = [...ROSTER.dateCol.keys()].filter(d => d > lastPlan).sort();
  ALLDATES = PLAN.dates.concat(extra);
  const NEWDAYS = new Set(extra);
  const today = new Date().toISOString().slice(0,10);
  DAY = ALLDATES.includes(today) ? today : lastPlan;
  const dateOpts = () => ALLDATES.map(d =>
    ({ value:d, label:d,
       sub: DRAFTS.has(d) ? "已有草稿" : (NEWDAYS.has(d) ? "計畫尚未建立" : "") }));
  dateCombo = combo({ value:DAY, options:dateOpts, placeholder:"日期", width:"130px",
    onChange: v => { if (v) { DAY = v; loadDay(); } } });
  $("#dateCb").replaceChildren(dateCombo);
  /* 基準日可以是出海計畫裡的日子,也可以是這個畫面上已經做好的草稿 ——
     出海計畫只寫到 9/14,不開放草稿就永遠沒辦法讓 9/16 參考 9/15。 */
  baseCombo = combo({ value:"", placeholder:"自動(檔案有排就照檔案,否則上一輪)", width:"235px", allowEmpty:true,
    /* [U] 最新的日期在最上面,一路往下到最舊;草稿只是多一個標記,不另外分段。 */
    options: () => {
      const all = new Set([...PLAN.dates, ...[...DRAFTS.keys()].filter(d => d !== DAY)]);
      return [...all].sort().reverse().map(d => ({ value:d, label:d,
        sub: PLAN.days.has(d) ? "" : "畫面上的草稿" }));
    },
    onChange: v => { baseCombo._pick = v; } });
  $("#baseCb").replaceChildren(baseCombo);
  loadDay();
  buildAhead();          // 讀完檔就先把下兩輪長出來(實測 14 天約 30 毫秒)
}

/* ---------- 下兩輪 ----------
   從出海計畫最後一天的隔天起算 14 天。做 7 休 7、星期二換班,
   所以 14 天剛好是兩個完整梯次。 */
function buildAhead(force) {
  const last = PLAN.dates[PLAN.dates.length - 1];
  const days = [];
  for (let i = 1; i <= 14; i++) {
    const d = addDays(last, i);
    if (!ROSTER.dateCol.has(d)) break;          // 總表還沒排到那麼遠就停
    if (!force && DRAFTS.has(d)) { days.push(d); continue; }   // 改過的不覆蓋
    const draft = buildDraft(PLAN, ROSTER, d, S, null);
    if (draft.error) continue;
    DRAFTS.set(d, draft);
    days.push(d);
  }
  PRE = { from: days[0] || "", to: days[days.length-1] || "", days };
  renderAhead();
}

const WD = ["日","一","二","三","四","五","六"];

function renderAhead() {
  const box = $("#aheadBody");
  box.innerHTML = "";
  if (!PRE || !PRE.days.length) {
    box.innerHTML = `<div class="issue info">產不出下兩輪 —— 通常是人力總表還沒填到那些日期。</div>`;
    $("#abadge").classList.add("hide");
    return;
  }
  let totalRed = 0, totalWarn = 0;
  const rows = PRE.days.filter(d => DRAFTS.has(d)).map(date => {
    const draft = DRAFTS.get(date);
    const ev = evaluate(teamsFromDraft(draft, ROSTER), ROSTER, date, S);
    totalRed += ev.summary.stop; totalWarn += ev.summary.warn;
    return { date, draft, ev };
  });

  const head = el("div","note");
  head.innerHTML = `<b>已經先幫你長好 ${PRE.from} ~ ${PRE.to} 共 ${rows.length} 天。</b>
    這是照每一天「上一輪同一天」的班表推出來的草稿,還沒寫進任何檔案。
    點右邊的<b>開啟</b>可以改人 —— 改完切到別天再切回來,內容都會留著。
    上面的按鈕會把<b>目前做好的 ${DRAFTS.size} 份草稿</b>一次寫進一個新的 Excel。`;
  box.append(head);

  for (let w = 0; w < 2; w++) {
    const part = rows.slice(w*7, w*7+7);
    if (!part.length) continue;
    const sec = el("div","wk");
    const red = part.reduce((n,x)=>n+x.ev.summary.stop,0);
    const wrn = part.reduce((n,x)=>n+x.ev.summary.warn,0);
    sec.append(el("h3","",
      `<span>第 ${w+1} 輪　${part[0].date} ~ ${part[part.length-1].date}</span>` +
      `<span class="sub">要處理 ${red} 則・提醒 ${wrn} 則</span>`));
    sec.append(el("div","dayrow head",
      `<span>日期</span><span>基準日 / 新回來的人</span>` +
      `<span class="n">隊伍</span><span class="n">已排</span>` +
      `<span class="n">可出海</span><span class="n">要處理</span><span></span>`));
    for (const x of part) {
      const s2 = x.ev.summary;
      const cls = s2.stop ? "bad" : (s2.warn ? "warnrow" : "okrow");
      const row = el("div","dayrow " + cls);
      row.append(el("span","d", `${x.date}<span>週${WD[new Date(x.date+"T00:00:00Z").getUTCDay()]}</span>`));
      row.append(el("span","info",
        `基準 ${x.draft.base}` +
        (x.draft.returning.length ? `　新回來 ${x.draft.returning.length} 位:` +
          esc(x.draft.returning.slice(0,3).map(p=>p.name).join("、")) : "")));
      row.append(el("span","n", String(x.draft.teams.length)));
      row.append(el("span","n", String(s2.scheduled)));
      row.append(el("span","n" + (s2.diff===0?" ok":""), String(s2.should)));
      row.append(el("span","n" + (s2.stop?" bad":(s2.warn?" wr":" ok")),
        s2.stop ? String(s2.stop) : (s2.warn ? s2.warn + " 提醒" : "OK")));
      const open = el("button","btn ghost sm","開啟");
      open.onclick = () => {
        DAY = x.date; dateCombo.setValue(DAY);
        loadDay();                 // 草稿由 loadDay 從 DRAFTS 取回,改過的內容會留著
        tab("plan");
      };
      row.append(open);
      sec.append(row);
    }
    box.append(sec);
  }
  const b = $("#abadge");
  b.textContent = totalRed;
  b.classList.toggle("hide", !totalRed);
}

function tab(name) {
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  ["overview","plan","ahead","issues","settings","notes"].forEach(t =>
    $("#tab-"+t).classList.toggle("hide", t !== name));
  if (name === "settings" && !CAND) buildSettings();
  if (name === "notes") buildNotes();
  if (name === "ahead" && PRE) renderAhead();     // 草稿可能被改過,重算一次
}

function loadDay() {
  $("#err").classList.add("hide");
  let teams, r;
  try { teams = teamsFromPlan(PLAN, ROSTER, DAY); r = evaluate(teams, ROSTER, DAY, S); }
  catch (e) { $("#err").classList.remove("hide"); $("#err").textContent = e.message; return; }
  LAST = r;
  renderStats(r);
  const noPlan = !PLAN.days.has(DAY);
  $("#wnote").innerHTML = noPlan
    ? `<div class="note"><b>出海計畫還沒有 ${esc(DAY)} 這一天。</b>
       上面的「總表可出海」還是算得出來,可以直接到<b>排班</b>分頁按「一鍵產生草稿」,
       它會照上一輪同一天的隊伍結構幫你開一份。</div>`
    : r.zone === "weather_off"
    ? `<div class="note">這一天總表全員留在岸上、沒有人標 OF,判定為<b>天氣取消</b>。
       班表本來就會先排人,取消時只畫刪除線或註記 WOW,所以不做人數比對。</div>` : "";
  $("#teams").innerHTML = "";
  if (noPlan) $("#teams").innerHTML =
    `<div class="issue info">這一天在出海計畫裡還沒有任何隊伍。</div>`;
  teams.filter(t => t.members.length || (t.turbines && t.turbines.length))
       .forEach(t => $("#teams").append(planCard(t, r)));
  renderIssues($("#issues"), r.issues);
  const b = $("#ibadge");
  b.textContent = r.summary.stop;
  b.classList.toggle("hide", !r.summary.stop);
  renderUnsched(r);
  $("#copybox").classList.add("hide");
  if (baseCombo) { baseCombo.setValue(""); baseCombo._pick = ""; }   // 換日期就不要沿用上一天挑的基準日
  /* [U] 切到別天再切回來,原本做好的草稿要原封不動地還在 */
  DRAFT = DRAFTS.get(DAY) || null;
  if (DRAFT) {
    $("#gmsg").textContent = (DRAFT.fromFile ? `照檔案裡 ${DRAFT.base} 的內容` : `基準日 ${DRAFT.base}`) + "(已儲存的草稿)";
    $("#gmsg").classList.remove("hide");
    showReturning(DRAFT);
    renderDraft();
  } else {
    $("#dteams").innerHTML =
      `<div class="issue info">按上面的「一鍵產生草稿」,產生後每個位子都可以直接換人。</div>`;
    $("#returning").innerHTML = ""; $("#livebar").innerHTML = "";
    $("#livebar").classList.add("hide");
    $("#draftIssues").innerHTML = `<div style="color:var(--ink-3)">還沒產生草稿。</div>`;
    $("#gmsg").classList.add("hide");
  }
}

function renderStats(r) {
  const s = r.summary;
  const zh = { plan:"未來計畫", history:"已發生", weather_off:"天氣取消", missing:"總表沒有這天" };
  $("#stats").innerHTML = "";
  [[s.teams,"隊伍",""],[s.scheduled,"班表已排",""],[s.should,"總表可出海",""],
   [(s.diff>0?"+":"")+s.diff,"差額", s.diff===0?"good":"hi"],
   [s.stop,"要處理", s.stop?"bad":"good"],[s.warn,"提醒",""],
   [zh[r.zone]||r.zone,"總表狀態",""]].forEach(([v,l,c]) =>
    $("#stats").append(el("div","stat "+(c||""), `<div class="v">${esc(v)}</div><div class="l">${l}</div>`)));
}

function renderIssues(host, issues) {
  host.innerHTML = issues.length ? "" : `<div class="issue info">沒有查到問題。</div>`;
  issues.forEach(i => host.append(el("div","issue "+i.level,
    `<div><span class="lvl">${({stop:"要處理",warn:"提醒",info:"說明"})[i.level]||i.level}</span>${esc(i.msg)}</div>` +
    (i.fix ? `<div class="fix">${esc(i.fix)}</div>` : ""))));
}

function renderUnsched(r) {
  $("#unsched").innerHTML = "";
  r.unschedulable.forEach(g => {
    const names = g.people.map(p =>
      `<span class="p">${esc(p.name)}<span class="lv"> ${esc(p.level)}</span></span>`).join("");
    const body = el("div","pl", g.minor ? "" : names);
    const head = el("div","gh",
      `<span>${esc(g.why)}${g.minor ? "(不在這一輪)" : ""}</span><span class="c">${g.people.length}</span>`);
    if (g.minor) {
      head.style.cursor = "pointer";
      const t = el("span","c"," 展開");
      head.firstChild.after(t);
      head.onclick = () => { const open = body.innerHTML !== "";
        body.innerHTML = open ? "" : names; t.textContent = open ? " 展開" : " 收合"; };
    }
    const d = el("div","grp"); d.append(head, body); $("#unsched").append(d);
  });
}

function teamTags(t, seats) {
  const tags = [];
  if (t.worktype) {
    const w = workLabel(t.worktype);
    tags.push(`<span class="tag wt">${esc(w.raw)}${w.zh ? " · " + esc(w.zh) : ""}</span>`);
  }
  if (t.night) tags.push(`<span class="tag n">夜班</span>`);
  if (t.painter) tags.push(`<span class="tag p">painter · 佔 ${R.PAINTER_SEATS} 席,不套用規則</span>`);
  tags.push(`<span class="tag${seats > (S.vessel_capacity ?? 12) ? " full":""}">船位 ${seats}</span>`);
  return tags.join("");
}

/* 機組標籤:點一下展開那支機組的故障描述 */
function turbineRow(t, prefix) {
  if (!t.turbines || !t.turbines.length) return null;
  const wrap = el("div","turbs");
  if (prefix) wrap.append(el("span","lbl", prefix));
  else wrap.append(el("span","lbl","機組"));
  const panel = el("div","faults hide");
  let openId = null;
  t.turbines.forEach(g => {
    const chip = el("button","turb",
      `${esc(g.id)}${g.items.length > 1 ? `<span class="n">${g.items.length}</span>` : ""}`);
    chip.onclick = () => {
      if (openId === g.id) { openId = null; panel.classList.add("hide");
        wrap.querySelectorAll(".turb").forEach(x => x.classList.remove("on")); return; }
      openId = g.id;
      wrap.querySelectorAll(".turb").forEach(x => x.classList.remove("on"));
      chip.classList.add("on");
      panel.classList.remove("hide");
      panel.innerHTML = `<div class="fh">${esc(g.id)}</div><ul>` + g.items.map(w => {
        const meta = [w.caseId && "ATS " + w.caseId, w.err && w.err !== "0" && "Error " + w.err,
                      w.ptw && "PTW " + w.ptw, w.so && "SO " + w.so].filter(Boolean).join("　");
        return `<li>${esc(w.fault || "(沒有填故障描述)")}` +
               (meta ? `<br><span class="meta">${esc(meta)}</span>` : "") + `</li>`;
      }).join("") + `</ul>`;
    };
    wrap.append(chip);
  });
  const box = el("div");
  box.append(wrap, panel);
  return box;
}

function planCard(t, r) {
  const c = el("div","team" + (t.night?" night":"") + (t.painter?" painter":"") +
                  (r.badTeams.has(t.name)?" bad":""));
  c.append(el("div","th", `<span class="tn">${esc(t.name)}</span><span class="tv">${esc(t.vessel)}</span>`));
  // 「核對人數」要跟檢核用的一樣:隱藏的人和 FMS/HL 不算
  const crewN = counted(t).filter(m => !(m.person &&
    (m.person.hidden || ((r.avail.get(m.person.name)||{}).cat === "away")))).length;
  c.append(el("div","tags", teamTags(t, seatsOf(t)) +
    (t.painter ? "" : `<span class="tag">核對 ${crewN} 人</span>`)));
  t.members.forEach(m => {
    const lv = memberLevel(m);
    c.append(el("div", "mem" + (m.struck?" struck":"") + (m.outsider?" out":"") +
      (!m.person && !m.outsider ? " unmatched" : ""),
      (m.prefix ? `<span class="lv">${m.prefix}</span>` : "") +
      `<span class="nm">${esc(m.display)}</span>` +
      (lv ? `<span class="lv">${esc(lv)}</span>` : "") +
      (m.struck ? `<span class="lv">取消</span>` : "") +
      (m.outsider ? `<span class="lv">外部</span>` : "") +
      (isSupportMember(m) ? `<span class="lv">岸上職務,支援出海</span>` : "") +
      (m.person && m.person.hidden ? `<span class="lv">總表已隱藏,不列入</span>` : "") +
      (!m.person && !m.outsider ? `<span class="lv">名字待對應</span>` : "")));
  });
  if (!t.members.length)
    c.append(el("div","gap","這一隊有工作,但還沒排任何人"));
  const tr = turbineRow(t);
  if (tr) c.append(tr);
  if (t.comment) c.append(el("div","cmt", esc(t.comment)));
  return c;
}

/* ---------- 草稿 ---------- */
function genDraft() {
  const d = buildDraft(PLAN, ROSTER, DAY, S, baseCombo._pick || null);
  if (d.error) { $("#err").classList.remove("hide"); $("#err").textContent = d.error; return; }
  DRAFT = d;
  DRAFTS.set(DAY, d);              // 存起來,切走再切回來還在
  $("#gmsg").textContent = d.fromFile ? `照檔案裡 ${d.base} 已排的內容` : `基準日 ${d.base}`;
  $("#gmsg").classList.remove("hide");
  showReturning(d);
  renderDraft();
}

const draftEval = () => evaluate(teamsFromDraft(DRAFT, ROSTER), ROSTER, DRAFT.target, S);

function showReturning(d) {

    ? `<div class="note" style="background:var(--navy-soft);border-left-color:var(--navy)">

       只把總表說當天不能出海的人挖掉、缺的補上;AOC 原本排好的人一個都沒動。
       想改成照上一輪重排,基準日那裡自己選一天再按一次。</div>`

    ? `<div class="note"><b>這一輪回來上班、但基準日那一輪整輪都沒被排到的人有 ${d.returning.length} 位:</b>
       ${d.returning.map(p => esc(p.name)+"("+esc(p.level)+")").join("、")}
       <br>複製上一輪的班表時最容易漏掉的就是這些人 —— Jimmy Hsu 就是這樣被漏掉的,請確認要不要補進去。</div>`
    : `<div class="note">這一輪沒有「上一輪整輪沒被排到、這一輪回來」的人,複製基準日不會漏人。</div>`;
  if (d.leave && d.leave.length) {

    w.style.borderLeftColor = "var(--ink-3)"; w.style.background = "var(--sunk)";
    w.innerHTML = `存成 Excel 時,底下 <b>Leave/Training</b> 會寫:${esc(d.leave.join("、"))}` +
      `(照這一天的總表;Coordinator / Warehouse / Standby 留空給 AOC 填)`;
    $("#returning").append(w);
  }
  if (d.tswaLeft && d.tswaLeft.length) {
    const w = el("div","note");
    w.innerHTML = `<b>TSWA 今天是奇數,${esc(d.tswaLeft.join("、"))} 沒排進去。</b>
      TSWA 每隊要成雙,所以整組有一位進不了;要換成別人留守的話,直接在葉片組的位子上換人就好。`;
    $("#returning").append(w);
  }
  if (d.zoneNote) {
    const w = el("div","note");
    w.style.borderLeftColor = "var(--warn)";
    w.style.background = "var(--warn-soft)";
    w.innerHTML = `<b>${esc(d.zoneNote)}</b>`;
    $("#returning").append(w);
  }
}

/* 某個位子可以選誰 —— 沒資格的完全不出現在清單裡。
   已經排在別隊的人會單獨列一組並標明在哪一隊,選了就自動從那一隊移走,
   免得合格的人都被佔走時清單變成空的、使用者卡住。 */
function slotOptions(team, slotIdx) {
  const lvOf = n => { const p = n && ROSTER.byName.get(n); return p ? p.level.toUpperCase() : ""; };
  // 只有「隊裡有歐洲技師」的 HV 隊才收緊隊長資格
  const isHV = (team.worktype||"").toUpperCase() === "HV" &&
               team.slots.some((s,i) => i !== slotIdx && lvOf(s.name) === R.EURO_LEVEL);
  // 葉片組只列 TSWA;其他隊不列 TSWA —— 他們不混隊
  const blade = isBladeTeam(team.worktype,
    team.slots.filter((s,i) => i !== slotIdx && s.name).map(s => lvOf(s.name)));
  const isLead = slotIdx === 0 && !team.painter && !blade;
  const mine = new Set(team.slots.filter((s,i) => i !== slotIdx && s.name).map(s => s.name));
  const where = new Map();
  DRAFT.teams.forEach(t => { if (t !== team) t.slots.forEach(s => s.name && where.set(s.name, t.name)); });
  const avoid = new Set((S.avoid_pairs||[]).map(p => [...p].sort().join(" ")));
  const excluded = new Set((S.exclude||[]).map(x => x.toLowerCase()));

  const fit = [], rest = [], taken = [], support = [], tswa = [];
  for (const p of ROSTER.people) {
    if (!ROSTER.isOffshore(p) && !ROSTER.isSupport(p)) continue;   // 純岸上職務不列
    if (excluded.has(p.name.toLowerCase())) continue;           // 排除名單不列
    if (!ROSTER.avail(p, DRAFT.target).ok) continue;            // 當天不能出海的不列
    if (mine.has(p.name)) continue;                             // 這一隊已經有他了
    if ([...mine].some(n => avoid.has([p.name,n].sort().join(" ")))) continue;   // 迴避組合不列
    const lv = p.level.toUpperCase();
    if (isLead && (isHV ? !R.HV_LEADER.includes(lv) : !R.LEADER.includes(lv))) continue;
    const o = { value:p.name, label:p.name, lv:p.level, sub:p.group };
    if (where.has(p.name)) taken.push({ ...o, sub:"已在 " + where.get(p.name) });
    else if (isBladeLevel(lv)) tswa.push(o);                    // TSWA 自成一組,要成雙
    else if (ROSTER.isSupport(p)) support.push(o);
    else if (isHV && (R.F_LEVELS.includes(lv) || lv === R.EURO_LEVEL)) fit.push(o);
    else rest.push(o);
  }
  const out = [];
  /* 葉片組:TSWA 排最前面;其他隊:TSWA 放最後一組,選了要記得湊成雙 */
  if (blade && tswa.length) {
    out.push({ head:true, label:"TSWA 葉片組(要成雙)" }, ...tswa);
    if (rest.length || fit.length) out.push({ head:true, label:"其他技師(葉片組通常只有 TSWA)" });
  }
  if (isHV && fit.length) {
    out.push({ head:true, label:"TSF / MTF / 歐洲技師(這一隊有 HV 需要)" }, ...fit);
    if (rest.length) out.push({ head:true, label:"其他可選的人" });
  }
  out.push(...rest);
  if (!blade && tswa.length) out.push({ head:true, label:"TSWA 葉片組(要兩位一起排,不能落單)" }, ...tswa);
  if (support.length) out.push({ head:true, label:"岸上職務(缺人手時才支援出海)" }, ...support);
  if (taken.length) out.push({ head:true, label:"已排在其他隊(選了會從那一隊移走)" }, ...taken);
  return out;
}

/* 把某個人從其他隊移走 —— 讓上面那一組選了之後不會變成同一人排兩隊 */
function releaseFrom(name, keepTeam) {
  for (const t of DRAFT.teams) {
    if (t === keepTeam) continue;
    for (const s of t.slots)
      if (s.name === name) { s.name = ""; s.kind = "gap"; s.why = `${name} 被調到別隊`; }
  }
}

    const seats = team.slots.filter(s => s.name || s.fixed).length;

                    (ev.badTeams.has(team.name)?" bad":""));

      `<span class="tn">${esc(team.name)}</span><span class="tv">${esc(team.vessel)}</span>`));

      DRAFT.fromFile ? "這一天的機組" : `基準日 ${DRAFT.base} 的機組`) : null;
    if (tr) c.append(tr);
    const copy = el("button","btn ghost sm","複製這一隊");
    copy.style.marginTop = "7px";

  const s = ev.summary;

    `<span>已排 <span class="n">${s.scheduled}</span> 人</span>` +
    `<span>總表可出海 <span class="n">${s.should}</span> 人</span>` +
    `<span>差額 <span class="n ${s.diff===0?"ok":"wr"}">${s.diff>0?"+":""}${s.diff}</span></span>` +
    `<span>要處理 <span class="n ${s.stop?"bad":"ok"}">${s.stop}</span></span>` +
    `<span>提醒 <span class="n wr">${s.warn}</span></span>` +
    `<span style="color:var(--ink-3);font-size:12.5px">每換一個人就重新檢核一次</span>`;
  renderIssues($("#draftIssues"), ev.issues);
  renderUnsched(ev);
}

function teamLine(team) {
  const parts = team.slots.map(s => {
    if (s.fixed) return s.fixed;
    if (!s.name) return "";
    const p = ROSTER.byName.get(s.name);
    return p ? shortName(p) + "-" + p.level : s.name;
  }).filter(Boolean);
  return `${team.name}: ${parts.join(", ")}`;
}
/* 班表上習慣寫 Winston.Lin 這種短名,盡量還原成一樣的格式 */
function shortName(p) {
  const s = p.name.replace(/-(GWS|IPS|Maxlines|TOWSC|Swire)$/i, "");
  const nick = [...s.matchAll(/\(([^)]*)\)/g)].map(m => m[1].trim()).filter(x => !isNameTag(x))[0];
  const base = s.replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim();
  let given, fam;
  if (base.includes(",")) {
    const i = base.indexOf(",");
    fam = base.slice(0,i).trim(); given = nick || base.slice(i+1).trim();
  } else {
    const parts = base.split(/\s+/);
    fam = parts[parts.length-1]; given = nick || parts.slice(0,-1).join(" ");
  }
  given = (given || "").trim().split(/\s+/)[0];        // 中間名不寫進縮寫
  return `${given}.${(fam||"").replace(/\s+/g,"")}`;
}

/* 把畫面上的草稿寫成一份全新的 Excel。原本那兩個檔案完全不會被改到 —— 
   工具從頭到尾只有「讀」原檔,這裡是另外生一個新檔。 */
function draftRows() {
  const ev = draftEval();
  const wd = ["日","一","二","三","四","五","六"][new Date(DRAFT.target+"T00:00:00Z").getUTCDay()];
  const rows = [];
  rows.push(["雲林排班草稿", "", "", "", "", "", ""]);
  rows.push(["日期", DRAFT.target, "星期" + wd, "", "基準日", DRAFT.base, ""]);
  rows.push(["產生時間", new Date().toLocaleString("zh-TW"), "", "", "", "", ""]);
  rows.push(["人力總表", ROSTER_INFO.file + " · " + ROSTER_INFO.sheet, "", "",
             "出海計畫", PLAN_INFO.file, ""]);
  rows.push([]);
  rows.push(["工作類型", "船", "隊伍", "成員(可直接貼進 Daily Ops 的 D 欄)",
             "核對人數", "船位", "說明"]);
  for (const t of DRAFT.teams) {
    const names = t.slots.map(x => {
      if (x.fixed) return x.fixed;
      if (!x.name) return "";
      const p = ROSTER.byName.get(x.name);
      return p ? shortName(p) + "-" + p.level : x.name;
    }).filter(Boolean);
    const seats = t.slots.filter(x => x.name || x.fixed).length;
    const cnt = t.painter ? "" : t.slots.filter(x => {
      const p = x.name && ROSTER.byName.get(x.name);
      return p && !ROSTER.isSupport(p);
    }).length;
    const gaps = t.slots.filter(x => !x.name && !x.fixed).length;
    const note = [t.night ? "夜班" : "", t.painter ? "painter,不套用規則" : "",
                  gaps ? `還缺 ${gaps} 人` : ""].filter(Boolean).join("、");
    rows.push([t.worktype || "", t.vessel || "", t.name, names.join(", "),
               cnt === "" ? "" : cnt, seats, note]);
  }
  rows.push([]);
  rows.push(["檢核結果", `要處理 ${ev.summary.stop} 則、提醒 ${ev.summary.warn} 則`,
             "", "", "", "", ""]);
  rows.push(["級別", "問題", "", "", "建議", "", ""]);
  for (const i of ev.issues)
    rows.push([{stop:"要處理",warn:"提醒",info:"說明"}[i.level] || i.level, i.msg,
               "", "", i.fix, "", ""]);
  if (!ev.issues.length) rows.push(["", "沒有查到問題", "", "", "", "", ""]);
  return rows;
}

/* 日期 → Excel 序號(1899-12-30 起算) */
const dateSerial = iso =>
  Math.round((new Date(iso + "T00:00:00Z") - Date.UTC(1899,11,30)) / 86400000);
const WEEKDAY = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* 把草稿寫進「出海計畫」的複本裡 —— 版面、顏色、其他分頁全部照舊。
   兩種情形:
     這一天已經在檔案裡 → 只改那幾格 D 欄的文字
     這一天還沒建立     → 整段複製基準日的區塊(連同樣式),再填上新的人 */
/* 把一天或多天的草稿寫進「出海計畫」的複本。
   已經有的日子只改 D 欄;還沒有的日子整段複製基準日的區塊,依序接在最後一天後面。
   原檔從頭到尾只被讀取。 */
async function exportPlanXlsx(btn, list) {
  const drafts = (list && list.length ? list.map(x => x.draft || x) : (DRAFT ? [DRAFT] : []))
    .filter(Boolean).sort((a,b) => a.target < b.target ? -1 : 1);
  if (!drafts.length) { alert("還沒有草稿可以存。"); return; }
  if (IN_ARTIFACT) { alert("網頁版不能直接存檔,請改用本機的 yunlin.html。"); return; }
  flash(btn, "產生中…");
  await new Promise(r => setTimeout(r, 30));

  const zip = PLAN.book.zip, part = PLAN.part;
  let xml = await readPart(zip, part);

  const nameOf = t => t.slots.map(x => {
    if (x.fixed) return x.fixed;
    if (!x.name) return "";
    const p = ROSTER.byName.get(x.name);
    return p ? shortName(p) + "-" + p.level : x.name;
  }).filter(Boolean);

  const rowRe = r => new RegExp(`<row r="${r}"[^>]*?(?:/>|>[\\s\\S]*?</row>)`);
  const sliceRows = (from, to) => {
    const re = /<row r="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g;
    let start = -1, end = -1, m;
    while ((m = re.exec(xml))) {
      const r = +m[1];
      if (r >= from && start < 0) start = m.index;
      if (r <= to) end = m.index + m[0].length;
      if (r > to) break;
    }
    return start < 0 ? null : { text: xml.slice(start, end), start, end };
  };

  const updated = [], added = [], skipped = [];

  // ---- 先處理已經存在的日子(只改格子,不動列數,所以位置不會跑掉) ----
  for (const dr of drafts) {
    if (!PLAN.days.has(dr.target)) continue;
    const day = PLAN.days.get(dr.target);
    const seg = sliceRows(day.headRow, day.endRow);
    if (!seg) { skipped.push(dr.target); continue; }
    let body = seg.text;
    for (const dt of dr.teams) {
      const src = day.teams.find(x => x.name === dt.name && x.night === dt.night);
      if (!src) continue;
      const rowsForD = src.dRows.length ? src.dRows : [src.headRow];
      const chunks = spread(nameOf(dt), rowsForD.length);
      rowsForD.forEach((r, i) => {
        const rm = body.match(rowRe(r));
        if (!rm) return;
        body = body.slice(0, rm.index) + editRow(rm[0], r, { D:{ text: chunks[i] || "" } }) +
               body.slice(rm.index + rm[0].length);
      });
    }
    xml = xml.slice(0, seg.start) + body + xml.slice(seg.end);
    updated.push(dr.target);
  }

  // ---- 再處理還沒有的日子:一天接一天疊在最後面 ----
  const lastDay = PLAN.days.get(PLAN.dates[PLAN.dates.length - 1]);
  let cursor = lastDay.endRow + 2;          // 空一列再接
  let blocks = "", hiRow = cursor;

  for (const dr of drafts) {
    if (PLAN.days.has(dr.target)) continue;
    // 基準日本身可能也是草稿(9/16 參考 9/15),版面要一路往回找到檔案裡真的有的那一天
    const base = layoutDay(PLAN, dr.base);
    const seg = base ? sliceRows(base.headRow, base.endRow) : null;
    if (!seg) { skipped.push(dr.target); continue; }
    const delta = cursor - base.headRow;
    let body = seg.text
      .replace(/<row r="(\d+)"/g, (_, r) => `<row r="${+r + delta}"`)
      .replace(/<c r="([A-Z]+)(\d+)"/g, (_, c, r) => `<c r="${c}${+r + delta}"`);
    const editAt = (r, edits) => {
      const rm = body.match(rowRe(r));
      if (!rm) return;
      body = body.slice(0, rm.index) + editRow(rm[0], r, edits) + body.slice(rm.index + rm[0].length);
    };
    editAt(base.headRow + delta, {
      A: { num: dateSerial(dr.target) },
      B: { text: WEEKDAY[new Date(dr.target + "T00:00:00Z").getUTCDay()] } });
    for (const bt of base.teams) {
      const dt = dr.teams.find(x => x.name === bt.name && x.night === bt.night);
      const rowsForD = bt.dRows.length ? bt.dRows : [bt.headRow];
      const chunks = dt ? spread(nameOf(dt), rowsForD.length) : rowsForD.map(() => "");
      rowsForD.forEach((r, i) => editAt(r + delta, { D:{ text: chunks[i] || "" } }));
      for (const r of bt.rows) editAt(r + delta,
        { E:{clear:true}, F:{clear:true}, G:{clear:true}, H:{clear:true},
          I:{clear:true}, J:{clear:true}, K:{clear:true}, L:{clear:true},
          M:{clear:true}, N:{clear:true} });
    }
    /* 底下的 Coordinator / Warehouse / Standby / Leave/Training 不是照抄基準日:
       Leave/Training 寫目標日總表上真的請假、訓練的人;其他三列清空留給 AOC 填。 */
    const leaveNames = leaveList(ROSTER, dr.target).map(p => shortName(p) + "-" + p.level);
    for (const [label, rows] of Object.entries(base.blockRows || {})) {
      const isLeave = /leave|training/i.test(label);
      const chunks = isLeave ? spread(leaveNames, rows.length) : rows.map(() => "");
      rows.forEach((r, i) => editAt(r + delta, { D:{ text: chunks[i] || "" } }));
    }
    blocks += body;
    hiRow = cursor + (base.endRow - base.headRow);
    added.push({ date: dr.target, at: cursor, base: dr.base });
    cursor = hiRow + 2;
  }

  if (blocks) {
    /* Excel 要求 <row> 的列號由小到大排;只要有一列順序不對,整個檔就會被判定
       「無法讀取的內容」而打不開。新區塊從 lastDay.endRow+2 起算,所以中間那一列
       空白列(endRow+1)也一定要一起清掉,否則它會被擠到新區塊後面,列號就倒退了。 */
    const lo = lastDay.endRow + 1;
    xml = xml.replace(/<row r="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g,
      (whole, r) => (+r >= lo && +r <= hiRow) ? "" : whole);
    const anchor = xml.match(rowRe(lastDay.endRow));
    if (anchor) xml = xml.slice(0, anchor.index + anchor[0].length) + blocks +
                      xml.slice(anchor.index + anchor[0].length);
    else xml = xml.replace("</sheetData>", blocks + "</sheetData>");
  }

  const blob = await rebuildXlsx(zip, { [part]: xml });
  const stem = PLAN_INFO.file.replace(/\.xlsx$/i, "");
  const tag = drafts.length === 1 ? drafts[0].target.replace(/-/g,"")
    : drafts[0].target.replace(/-/g,"") + "-" + drafts[drafts.length-1].target.replace(/-/g,"");
  const fname = `${stem}_${tag}.xlsx`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);

  const lines = [];
  if (updated.length) lines.push(`更新既有日期 ${updated.length} 天:${updated.join("、")}`);
  if (added.length) lines.push(`新增 ${added.length} 天,從第 ${added[0].at} 列開始:` +
    added.map(x => x.date).join("、"));
  if (skipped.length) lines.push(`跳過 ${skipped.length} 天(找不到基準日的版面):${skipped.join("、")}`);
  alert(lines.join("\n") + "\n\n已另存為:" + fname +
        "\n(" + (blob.size/1e6).toFixed(1) + " MB)" +
        "\n\n原本的 " + PLAN_INFO.file + " 完全沒有被更動。");
  flash(btn, "已產生");
}

async function exportXlsx(btn) {
  if (!DRAFT) { alert("請先按「一鍵產生這一天的草稿」。"); return; }
  const blob = makeXlsx("班表草稿", draftRows(), [12, 14, 14, 62, 10, 8, 30]);
  const fname = `雲林班表草稿_${DRAFT.target.replace(/-/g,"")}.xlsx`;

/* ---------- 1. 2. 3. 名單 ----------
   [U] 2026-09-15 Tina:「我要今天可以出海的技師名單,用 1 2 3 列出來,用檔案裡的本名+英文名」。
   名字照總表原樣(Hsiao, Yi-Ying (Manfred)),只拿掉全大寫的公司註記 (SPIE)、(BGB)。 */
function listName(n) {
  return n.replace(/\s*\(([^)]*)\)/g, (m, t) => isNameTag(t.trim()) ? "" : m).replace(/\s+/g, " ").trim();
}
function dayTeamsNow() {
  return (DRAFT && DRAFT.target === DAY) ? teamsFromDraft(DRAFT, ROSTER) : teamsFromPlan(PLAN, ROSTER, DAY);
}
function buildList(kind) {
  const teams = dayTeamsNow();
  const ev = evaluate(teams, ROSTER, DAY, S);
  const okAvail = p => { const a = ev.avail.get(p.name) || {};
    return a.ok && (a.cat === "available" || a.cat === "offshore" ||
                    (a.cat === "support" && ev.scheduled.has(p.name))); };
  // 班表已排:照隊伍順序;不算劃掉的、外部支援、隱藏的、不為雲林工作的
  const sched = [], seen = new Set();
  for (const t of teams) {
    if (t.painter) continue;
    for (const m of t.members) {
      if (m.struck || m.outsider || !m.person || m.person.hidden || seen.has(m.person.name)) continue;
      if ((ev.avail.get(m.person.name) || {}).cat === "away") continue;
      seen.add(m.person.name); sched.push(m.person);
    }
  }
  const avail = ROSTER.people.filter(okAvail);                 // 照總表順序
  const main = kind === "scheduled" ? sched : avail;
  const title = kind === "scheduled"
    ? `${DAY} 班表已排的技師(${sched.length} 位,照隊伍順序${DRAFT && DRAFT.target === DAY ? ",含畫面上的草稿" : ""})`
    : `${DAY} 總表可出海的技師(${avail.length} 位,照總表順序)`;
  const lines = [title, ...main.map((p, i) => `${i + 1}. ${listName(p.name)}`)];
  const schedSet = new Set(sched.map(p => p.name)), availSet = new Set(avail.map(p => p.name));
  const onlyA = avail.filter(p => !schedSet.has(p.name)), onlyS = sched.filter(p => !availSet.has(p.name));
  if (onlyA.length || onlyS.length) lines.push("");
  if (onlyA.length) lines.push(`總表可出海、但班表沒排到(${onlyA.length}):` + onlyA.map(p => listName(p.name)).join("、"));
  if (onlyS.length) lines.push(`班表有排、但總表當天不是可出海(${onlyS.length}):` +
    onlyS.map(p => `${listName(p.name)}(${(ev.avail.get(p.name)||{}).why || "?"})`).join("、"));
  return lines.join("\n");
}
async function showList(kind, boxSel, btn) {
  const txt = buildList(kind);

  box.classList.remove("hide"); box.value = txt;
  try { await navigator.clipboard.writeText(txt); flash(btn, "已複製"); }

}

async function copyText(txt, btn) {
  try { await navigator.clipboard.writeText(txt); if (btn) flash(btn, "已複製"); }
  catch (_) {
    const box = $("#copybox");
    box.classList.remove("hide"); box.value = txt; box.focus(); box.select();
    if (btn) flash(btn, "請按 Ctrl+C");
  }
}
function flash(btn, t) {
  const old = btn.textContent;
  btn.textContent = t;
  setTimeout(() => btn.textContent = old, 1600);
}

/* ---------- 設定 ---------- */
function buildCandidates() {
  const offshore = ROSTER.people.filter(p => ROSTER.isOffshore(p));
  const leaders = offshore.filter(p => ROSTER.canLead(p));
  const nights = new Map();
  const last = PLAN.dates[PLAN.dates.length-1];
  for (const d of PLAN.dates) {
    if ((new Date(last) - new Date(d)) / 86400000 > 90) continue;
    linkNames(PLAN, ROSTER, d);
    for (const t of PLAN.days.get(d).teams) {
      if (!t.night) continue;
      for (const m of t.members) if (m.person && !m.struck)
        nights.set(m.person.name, (nights.get(m.person.name)||0)+1);
    }
  }
  const js = ps => ps.map(p => ({ name:p.name, level:p.level, group:p.group }));
  return { leaders: js(leaders), offshore: js(offshore), all: js(ROSTER.people),   // 隱藏的人不列
    night: [...nights.entries()].sort((a,b)=>b[1]-a[1]).map(([name,times]) =>
      ({ name, times, level:(ROSTER.byName.get(name)||{}).level||"",
         group:`近 90 天上過 ${times} 次夜班` })) };
}

function buildSettings() {
  CAND = buildCandidates();

  box.append(cardFile(), cardLeaderOrder(), cardOvertime(),

    cardCheck("night_fixed","夜班固定人選",CAND.night,
      "只列出近 90 天真的上過夜班的人,沒上過的不會出現,免得清單太長。"),
    cardCheck("exclude","排除名單",CAND.all,
      "勾起來的人不會被自動排進任何一隊,草稿的下拉選單裡也不會出現。"),
    cardNumbers());
}

function cardLeaderOrder() {
  const c = el("div","card", `<h2>隊長優先順序</h2>
    <div class="hint">只列 TS、TSF、MT、MTF 這四級 —— CT 和 BT 只能當隊員,不會出現在這裡。

  S.leader_order = S.leader_order || [];
  const list = el("div","ordlist");
  const render = () => {
    list.innerHTML = "";
    S.leader_order = S.leader_order.filter(n => CAND.leaders.some(p => p.name === n));
    const rest = CAND.leaders.filter(p => !S.leader_order.includes(p.name)).map(p => p.name);
    S.leader_order.concat(rest).forEach((name,i) => {
      const p = CAND.leaders.find(x => x.name === name);

function cardPairs(key, title, hint) {
  const c = el("div","card", `<h2>${title}</h2><div class="hint">${hint}</div>`);
  S[key] = S[key] || [];
  let a = "", b = "";
  const list = el("div","pl-list");
  const opts = other => CAND.offshore
    .filter(p => p.name !== other)
    .filter(p => !other || !S[key].some(pr => pr.includes(p.name) && pr.includes(other)))
    .map(p => ({ value:p.name, label:p.name, lv:p.level, sub:p.group }));
  const cbA = combo({ placeholder:"輸入姓名搜尋…", allowEmpty:true,
    options: () => opts(b), onChange: v => { a = v; b = ""; cbB.setValue(""); } });
  const cbB = combo({ placeholder:"輸入姓名搜尋…", allowEmpty:true,
    options: () => opts(a), onChange: v => { b = v; } });
  const add = el("button","btn","加入");
  add.onclick = () => {
    if (!a || !b || a === b) return;
    if (S[key].some(p => p.includes(a) && p.includes(b))) return;
    S[key].push([a,b]);
    a = ""; b = ""; cbA.setValue(""); cbB.setValue(""); render();
  };
  const render = () => {
    list.innerHTML = "";
    S[key].forEach((p,i) => {
      const t = el("span","pair", `${esc(p[0])} ＋ ${esc(p[1])}`);
      const x = el("button","","移除");
      x.onclick = () => { S[key].splice(i,1); render(); };
      t.append(x); list.append(t);
    });
    if (!S[key].length) list.innerHTML = `<span class="hint">還沒有設定任何組合。</span>`;
  };
  render();
  const row = el("div","pairs");
  row.append(cbA, el("span","","＋"), cbB, add);
  c.append(row, list); saveRow(c); return c;
}

function cardCheck(key, title, people, hint) {
  const c = el("div","card", `<h2>${title}</h2><div class="hint">${hint}</div>`);
  S[key] = S[key] || [];
  const search = el("input");
  search.placeholder = "搜尋姓名…"; search.style.cssText = "margin-bottom:8px;width:220px";
  const box = el("div","chk");
  const render = () => {
    const q = clean(search.value);
    box.innerHTML = "";
    people.filter(p => !q || clean(p.name).includes(q)).forEach(p => {
      const lab = el("label","",
        `<input type="checkbox" ${S[key].includes(p.name) ? "checked" : ""}>` +
        `<span>${esc(p.name)}</span><span class="lv">${esc(p.level||"")}</span>` +
        `<span class="gp">${esc(p.group||"")}</span>`);
      lab.querySelector("input").onchange = e => {
        const set = new Set(S[key]);
        e.target.checked ? set.add(p.name) : set.delete(p.name);
        S[key] = [...set];
      };
      box.append(lab);
    });
    if (!box.children.length) box.innerHTML = `<span class="hint">沒有符合的人。</span>`;
  };
  search.oninput = render; render();
  c.append(search, box); saveRow(c); return c;
}

function snapshot() {
  const ev = DRAFT ? draftEval() : LAST;
  const lines = [];
  lines.push(`看的日期:${DAY || "-"}`);
  lines.push(DRAFT ? `已產生草稿,基準日 ${DRAFT.base}` : "沒有產生草稿(看的是 Excel 原本的內容)");
  if (ev) lines.push(`當時:已排 ${ev.summary.scheduled} 人 / 總表可出海 ${ev.summary.should} 人 ` +
                     `/ 要處理 ${ev.summary.stop} 則 / 提醒 ${ev.summary.warn} 則`);
  lines.push(`門檻:一隊最少 ${S.min_team} 人、年保理想 ${S.as_ideal} 下限 ${S.as_acceptable}、一船 ${S.vessel_capacity} 席`);
  lines.push(`排除名單 ${(S.exclude||[]).length} 人;隊長順序前三:${(S.leader_order||[]).slice(0,3).join("、") || "未設定"}`);
  lines.push(`綁定 ${(S.bind_pairs||[]).length} 組、迴避 ${(S.avoid_pairs||[]).length} 組、夜班固定 ${(S.night_fixed||[]).length} 人`);
  lines.push(`加班意願已設定 ${Object.keys(S.overtime||{}).length} 人`);
  if (ev && ev.issues.length)
    lines.push("當時的問題:" + ev.issues.slice(0,5).map(i => i.msg).join(" / ") +
               (ev.issues.length > 5 ? ` …等 ${ev.issues.length} 則` : ""));
  return { state: lines.join("\n"), settings: JSON.parse(JSON.stringify(S)),
           day: DAY, base: DRAFT ? DRAFT.base : null, summary: ev ? ev.summary : null };
}

function buildNotes() {
  const box = $("#notes");
  box.innerHTML = "";
  const c = el("div","card", `<h2>留言 / 使用心得</h2>
    <div class="hint">寫下哪裡怪怪的、哪裡想改。送出時會<b>自動把你現在畫面的狀況一起記下來</b> ——
      看的是哪一天、有沒有產生草稿、基準日、當下的設定、當時有幾個問題。
      這樣看到留言的人才知道你是在什麼條件下講這句話。留言存在這台電腦,不會傳出去。</div>`);
  const snap = snapshot();
  c.append(el("div","snap", `<b>會一起記下來的現況</b><br>` + esc(snap.state).replace(/\n/g,"<br>")));
  const ta = el("textarea","big");
  ta.placeholder = "例:Snail 2 只有 1 個人一直跳提醒,但那天本來就只派一個人去看葉片,這種可不可以不要提醒?";
  const row = el("div","act");
  const send = el("button","btn","送出留言");
  const msg = el("span","saved hide","已記錄");
  send.onclick = () => {
    const t = ta.value.trim();
    if (!t) { ta.focus(); return; }
    NOTES.unshift({ at:new Date().toISOString(), text:t, ...snapshot() });
    saveN(); ta.value = "";
    buildNotes();
    const m2 = $("#notes").querySelector(".saved");
    if (m2) { m2.classList.remove("hide"); setTimeout(()=>m2.classList.add("hide"),1800); }
  };
  row.append(send, msg);
  c.append(ta, row);
  box.append(c);

  if (NOTES.length) {
    const list = el("div","card");
    const head = el("div","act");
    head.append(el("h2","","已記錄的留言(" + NOTES.length + " 則)"));
    const copyAll = el("button","btn ghost sm","複製全部留言(含當時設定)");
    copyAll.onclick = () => copyText(NOTES.map(noteText).join("\n\n" + "─".repeat(40) + "\n\n"), copyAll);
    head.append(copyAll);
    list.append(head);
    const wrap = el("div","msglist");
    NOTES.forEach((n,i) => {
      const it = el("div","msgitem");
      const h = el("div","mh",
        `<span>${new Date(n.at).toLocaleString("zh-TW")}</span>` +
        `<span>日期 ${esc(n.day||"-")}</span>` +
        (n.base ? `<span>基準日 ${esc(n.base)}</span>` : `<span>無草稿</span>`) +
        (n.summary ? `<span>要處理 ${n.summary.stop} · 提醒 ${n.summary.warn}</span>` : ""));
      const rm = el("button","mrm","刪除");
      rm.onclick = () => { NOTES.splice(i,1); saveN(); buildNotes(); };
      h.append(rm);
      it.append(h, el("div","mb", esc(n.text)));
      const one = el("button","btn ghost sm","複製這一則");
      one.style.marginTop = "8px";
      one.onclick = () => copyText(noteText(n), one);
      it.append(one);
      wrap.append(it);
    });
    list.append(wrap);
    box.append(list);
  }
}

function noteText(n) {
  return [
    `【留言】${new Date(n.at).toLocaleString("zh-TW")}`,
    n.text,
    "",
    "【當時的畫面狀況】",
    n.state || "(沒有記錄)",
    "",
    "【當時的設定】",
    JSON.stringify(n.settings, null, 2),
  ].join("\n");
}

/* 「全部存成新的出海計畫」= 畫面上所有做好的草稿,不只下兩輪那 14 天 */
$("#exportAhead").onclick = e =>
  exportPlanXlsx(e.currentTarget, [...DRAFTS.keys()].sort().map(d => DRAFTS.get(d)));
/* [U] 2026-09-19 Tina:分別存 9/22 和 9/23,得到兩個檔,各自只接一天。
   要的是「存 9/23 時,9/22 也一起在裡面」—— 所以這顆按鈕存的是這一天以前(含)所有做好的草稿,
   一個檔就從檔案最後一天一路接到目前這一天,不會有缺日。 */
$("#exportplan").onclick = e => {
  if (!DRAFT) { alert("請先按「一鍵產生這一天的草稿」。"); return; }
  const list = [...DRAFTS.keys()].filter(d => d <= DAY).sort().map(d => DRAFTS.get(d));
  exportPlanXlsx(e.currentTarget, list);
};
$("#exportx").onclick = e => exportXlsx(e.currentTarget);
$("#copyall").onclick = () => {
  if (!DRAFT) { alert("請先按「一鍵產生這一天的草稿」。"); return; }
  copyText([`${DRAFT.target}(基準日 ${DRAFT.base})`, ""]
    .concat(DRAFT.teams.map(teamLine)).join("\n"), $("#copyall"));
};
/* 總表會一直換新版:只換那一個檔,設定、日期、草稿都保留。 */
const swapInput = el("input");
swapInput.type = "file"; swapInput.accept = ".xlsx"; swapInput.style.display = "none";
document.body.append(swapInput);
swapInput.onchange = async () => {
  const f = swapInput.files[0];
  swapInput.value = "";
  if (!f) return;
  const old = ROSTER;
  try {
    const book = await Book.open(f, () => {});
    if (!book.sheetNames.some(n => /^allowance/i.test(n))) {
      alert("這個檔案沒有 Allowance 分頁,不像是人力總表。"); return;
    }
    await book.prepare(() => {});
    ROSTER = await Roster.build(book, () => {});
    ROSTER_INFO = { file:f.name, sheet:ROSTER.sheetName };
  } catch (err) { ROSTER = old; alert("讀取失敗:" + err.message); return; }

  // 出海計畫的姓名對應是快取在 day._linked 上的,換名冊後要全部重算
  for (const day of PLAN.days.values()) {
    day._linked = false;
    for (const t of day.teams) for (const m of t.members) m.person = null;
  }
  CAND = null; DRAFT = null;

  // 設定裡的人名可能在新總表找不到
  const names = new Set(ROSTER.people.map(p => p.name));
  const miss = new Set();
  for (const k of ["exclude","leader_order","night_fixed"])
    (S[k]||[]).forEach(n => { if (!names.has(n)) miss.add(n); });
  for (const k of ["avoid_pairs","bind_pairs"])
    (S[k]||[]).forEach(pr => pr.forEach(n => { if (!names.has(n)) miss.add(n); }));
  Object.keys(S.overtime||{}).forEach(n => { if (!names.has(n)) miss.add(n); });

  const lastPlan = PLAN.dates[PLAN.dates.length-1];
  ALLDATES = PLAN.dates.concat([...ROSTER.dateCol.keys()].filter(d => d > lastPlan).sort());
  if (!ALLDATES.includes(DAY)) { DAY = lastPlan; dateCombo.setValue(DAY); }
  $("#files").innerHTML =
    `<b>${esc(ROSTER_INFO.file)}</b> · ${esc(ROSTER_INFO.sheet)} · ${ROSTER.people.length} 人　　` +
    `<b>${esc(PLAN_INFO.file)}</b> · ${esc(PLAN_INFO.sheet)} · ${PLAN.dates.length} 天 ` +
    `(${PLAN.dates[0]} ~ ${lastPlan})`;
  loadDay();
  if (PRE) renderAhead();          // 換了總表,下兩輪那幾天的檢核要重算
  tab("overview");
  const box = el("div","note");
  box.innerHTML = `<b>已換成 ${esc(f.name)}</b> —— ${ROSTER.people.length} 人,` +
    `日期到 ${[...ROSTER.dateCol.keys()].sort().pop()}。設定和草稿沒有被清掉。` +
    (miss.size ? `<br>不過設定裡有 <b>${miss.size}</b> 位在新總表找不到:` +
      esc([...miss].slice(0,10).join("、")) + `,那幾筆設定會自動失效,建議到設定頁確認一下。` : "");
  $("#wnote").prepend(box);
};
$("#swap").onclick = () => swapInput.click();

$("#reload").onclick = () => {
  ROSTER = PLAN = DAY = null; CAND = null; DRAFT = null;
  $("#app").classList.add("hide"); $("#start").classList.remove("hide");
  $("#d1").classList.remove("on"); $("#d2").classList.remove("on");
  $("#n1").textContent = "人力總表　尚未選取";
  $("#n2").textContent = "每日出海計畫　尚未選取";
  prog(""); $("#startwarn").classList.add("hide"); $("#picker").value = "";
};
if (!("DecompressionStream" in window)) {
  $("#startwarn").classList.remove("hide");
  $("#startwarn").textContent = "這個瀏覽器太舊,無法解開 Excel 檔。請改用 Edge 或 Chrome 開啟。";
}
</script>
</body>
</html>
